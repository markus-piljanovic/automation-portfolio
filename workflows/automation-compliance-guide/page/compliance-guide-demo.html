<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Automation Compliance Guide – Demo</title>
<style>
@font-face{font-family:'DM Sans';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/dm-sans-400.ttf) format('truetype')}
@font-face{font-family:'DM Sans';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/dm-sans-500.ttf) format('truetype')}
@font-face{font-family:'DM Sans';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/dm-sans-600.ttf) format('truetype')}
@font-face{font-family:'DM Sans';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/dm-sans-700.ttf) format('truetype')}
</style>
<style>
/* KONTEXT: Entwurf Seite 1 und 2 der Compliance-Guide-Demo, hell auf dunkelgrünem Canvas, vertikal.
   BEISPIEL: Klick auf "Weiter" schiebt Seite 2 (Daten) in die Karte; rechts klappt die Karte "Daten" zu und "Projekt und Rolle" wird zum grünen Haken. */

/* ---------- ABSCHNITT 1: Farben und Grundlagen ---------- */
:root{
  --bg:#0f2a21; --card:#ffffff; --line:#e2e6ec; --ink:#1b2330; --mut:#6a7485; --faint:#a3abb8;
  --acc:#1e9a69; --acc-bg:#e3f5ec; --gl:#8ccfae; --dim:#153227;
  --t:.55s cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(circle,rgba(255,255,255,.10) 1.2px,transparent 1.4px) 0 0/22px 22px,var(--bg);color:var(--ink);font:15px/1.45 "DM Sans","Segoe UI",system-ui,sans-serif;height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column}

/* ---------- ABSCHNITT 2: Kopfzeile ---------- */
.top{width:100%;max-width:940px;margin:0 auto;padding:clamp(8px,2vh,24px) 20px 0;flex:none;display:flex;align-items:center;gap:12px}
.top h1{font-size:18px;font-weight:650;letter-spacing:-.01em;color:#eaf7f0}
.top small{color:#8fb5a2;font-weight:400;margin-left:6px;font-size:13px}
.top .sp{flex:1}
.pill{font-size:12px;color:#7fe3bd;background:rgba(95,227,192,.12);border:1px solid rgba(95,227,192,.4);padding:4px 11px;border-radius:99px;white-space:nowrap}

/* ---------- ABSCHNITT 3: Bühne (links aktive Seite, rechts Weg) ---------- */
.wrap{width:100%;max-width:940px;margin:clamp(8px,2vh,22px) auto clamp(10px,2.2vh,26px);padding:0 20px;flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:20px;align-items:stretch}

/* ---------- ABSCHNITT 4: Aktive Seite links ---------- */
.main{background:var(--card);border-radius:18px;padding:clamp(12px,2.2vh,28px) 28px clamp(10px,1.8vh,20px);display:flex;flex-direction:column;min-height:0;box-shadow:0 8px 28px rgba(0,0,0,.25)}
.cont{flex:1;min-height:0;display:flex;flex-direction:column;transition:transform .3s ease,opacity .3s ease}
/* „Beim Wechsel: alter Inhalt schiebt weg, neuer kommt von der Seite.“ */
.cont.out-l{transform:translateX(-46px);opacity:0}
.cont.out-r{transform:translateX(46px);opacity:0}
.cont.pre-r{transform:translateX(46px);opacity:0;transition:none}
.cont.pre-l{transform:translateX(-46px);opacity:0;transition:none}
.mh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.step{font-size:12px;font-weight:650;color:var(--acc);text-transform:uppercase;letter-spacing:.06em}
.main h2{font-size:22px;letter-spacing:-.02em;margin-top:0}
.sub{color:var(--mut)}
.law{display:inline-block;font-size:12px;color:var(--mut);background:#f1f4f2;border:1px solid var(--line);border-radius:99px;padding:1px 10px}
.row{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;padding:clamp(6px,1.2vh,16px) 0;border-top:2px solid var(--gl);margin-top:clamp(6px,1.2vh,16px)}
.row:first-of-type{margin-top:clamp(8px,1.6vh,18px)}
.row.pair{display:grid;grid-template-columns:1fr 1fr;gap:0 24px;align-content:center}
.ql{position:relative;display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:clamp(6px,1.2vh,12px);font-weight:650;font-size:17px;color:#0d4f37}
.ql em{font-style:normal;font-weight:400;color:#8a94a3;font-size:11.5px;margin-left:auto;order:2}
.qq{color:var(--mut);font-size:13.5px;font-weight:400;flex-basis:100%;order:3;margin:-4px 0 0}

/* ---------- ABSCHNITT 5: Eingabefeld und Antwort-Chips ---------- */
.inp{width:100%;padding:clamp(8px,1.2vh,12px) 14px;border:1px solid var(--line);border-radius:11px;font:inherit;background:#fff;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.c{position:relative;padding:clamp(6px,1vh,10px) 14px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);font-size:14px;cursor:default;transition:border-color .15s}
.c:hover{border-color:var(--faint)}
.c.on{background:var(--acc-bg);border-color:var(--acc);color:#0d6b46;font-weight:600}
.c.on::before{content:"✓";margin-right:7px;font-weight:700}
.c[data-ex]:hover::after{content:attr(data-ex);position:absolute;left:0;bottom:calc(100% + 6px);z-index:5;background:var(--ink);color:#fff;font-size:12px;font-weight:400;padding:6px 10px;border-radius:8px;white-space:nowrap}
.info{width:17px;height:17px;border-radius:50%;border:1px solid var(--faint);color:var(--faint);font-size:11px;font-weight:600;display:inline-grid;place-items:center;cursor:help}
.info:hover::after{content:attr(data-tip);position:absolute;left:0;top:calc(100% + 2px);width:max-content;max-width:min(400px,90vw);white-space:normal;z-index:6;background:var(--ink);color:#fff;font-weight:400;font-size:12.5px;line-height:1.4;padding:9px 12px;border-radius:10px}

/* „Gruppierte Chips: kleines Etikett vor den Chips der Gruppe.“ */
.chips.gr{gap:6px 16px}
.grp{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.gl{font-size:11.5px;color:var(--mut);margin-right:2px}
.tb .chips.gr{gap:4px 14px}

/* ---------- ABSCHNITT 5b: Neue Bedienung (nur Seite 3): Form zeigt die Art der Auswahl, Handlungsanweisung, feste Etikettenspalte ---------- */
.gc{display:contents}
.neu .c::before{content:"";display:inline-block;width:11px;height:11px;border:1.5px solid #9aa4b2;margin-right:7px;vertical-align:-1px;box-sizing:border-box;background:#fff;font-size:8px;line-height:8px;text-align:center;color:#fff;font-weight:700}
.neu .c.r::before{border-radius:50%}
.neu .c.k::before{border-radius:3px}
.neu .c.on::before{content:"";border-color:var(--acc);background:var(--acc)}
.neu .c.k.on::before{content:"✓"}
.neu .c.r.on::before{background:radial-gradient(circle,var(--acc) 0 2.6px,#fff 3px)}
.neu .chips.gr{flex-direction:column;flex-wrap:nowrap;gap:6px}
.neu .grp+.grp{border-top:1px dotted #cfd8d3;padding-top:3px;margin-top:1px}
.nt{font-size:11.5px;color:#6a7485;align-self:center;white-space:nowrap}
.tc .ql{margin-bottom:3px}
.tc .neu .grp{grid-template-columns:122px 1fr}
.tc .nt{font-size:11px}
.tc .neu .grp+.grp{padding-top:1px;margin-top:0}
.tc .neu .chips.gr{gap:1px}
.tc .neu .c{padding:2px 9px}
.gh{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:#8a94a3;font-weight:600;margin-bottom:-2px}
.neu .grp{display:grid;grid-template-columns:132px 1fr;align-items:start;gap:0}
.neu .gc{display:flex;flex-wrap:wrap;gap:6px}
.neu .gl{font-size:13px;font-weight:600;color:#0d4f37;padding-top:5px;margin:0}
.tb .neu .chips.gr{gap:3px}
.tb .neu .c{padding:3px 9px;font-size:12.5px}
.tb .neu .gl{padding-top:3px;font-size:12.5px}
.tb .neu .row{padding-top:4px;padding-bottom:4px;margin-top:4px}

/* ---------- ABSCHNITT 6: Knöpfe ---------- */
.foot{flex:none;display:flex;align-items:center;gap:14px;border-top:2px solid var(--gl);padding-top:8px;margin-top:2px}
.hint{color:var(--faint);font-size:12px;flex:1}
.btn{border:1px solid var(--line);background:#fff;color:#55606f;padding:5px 14px;border-radius:9px;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer}
.btn:disabled{color:var(--faint);cursor:default}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:#17805a}
.btn.pri:disabled{background:#cfe5da;border-color:#cfe5da;color:#fff}

/* ---------- ABSCHNITT 7: Weg rechts (erledigt = Haken, aktuell = zugeklappt, wartend = Karte) ---------- */
.side{min-height:0;padding-top:2px}
.side h3{font-size:12px;color:#7fa391;text-transform:uppercase;letter-spacing:.06em;font-weight:650;padding:0 4px 10px}
/* „Jeder Block klappt per Grid-Trick sanft auf und zu.“ */
.g{display:grid;grid-template-rows:1fr;opacity:1;transition:grid-template-rows var(--t),opacity .4s}
.g>.in{overflow:hidden;min-height:0}
.g.off{grid-template-rows:0fr;opacity:0}
.w{margin-bottom:10px;border:1px dashed rgba(255,255,255,.2);border-radius:14px;padding:11px 14px;background:var(--dim);transition:background .3s,border-color .3s}
.wt{display:flex;align-items:center;gap:9px;font-weight:650;color:#a9c7b8}
.wt i{font-style:normal;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.1);color:#a9c7b8;font-size:12px;display:grid;place-items:center}
.w ul{list-style:none;margin:8px 0 0 31px;color:#7fa391;font-size:13px}
.w ul li{padding:1px 0}
/* „Kurz vor dem Wechsel leuchtet die Karte auf, die gleich nach links wandert.“ */
.it.lit .w{background:#1f5a44;border:1px solid #5fe3c0}
.it.lit .wt,.it.lit .wt i{color:#eaf7f0}
.dn{margin-bottom:10px;display:flex;align-items:center;gap:9px;padding:9px 14px;border-radius:12px;background:#17402f;border:1px solid rgba(95,227,192,.45);color:#9ff0d2;font-weight:600;font-size:14px;cursor:pointer}
.dn i{font-style:normal;width:20px;height:20px;border-radius:50%;background:#5fe3c0;color:#0f2a21;font-size:12px;font-weight:700;display:grid;place-items:center}
.dn:hover{background:#1d4d39}

/* ---------- ABSCHNITT 8: Enger setzen. JS setzt auf body die Klasse ta (Frage neben den Titel) und tb (Chips kleiner, Untertitel weg), je nach Fensterhöhe und Dichte der Seite ---------- */
.pair .qq{order:3;flex-basis:100%}
.pair .ql em{order:2}
.ta .qq{flex:0 1 auto;flex-basis:auto;order:0;margin:0 0 0 2px;font-size:12.5px;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.ta .ql{flex-wrap:nowrap;gap:6px;white-space:nowrap}
.ta .ql em{white-space:nowrap;font-size:11.5px;order:3;flex:none;margin-left:auto}
.ta .pair .ql{flex-wrap:wrap;white-space:normal}
.ta .pair .qq{order:3;flex-basis:100%;margin:-4px 0 0;white-space:normal}
.ta .pair .ql em{order:2}
.ta .c{font-size:13.5px;padding:6px 12px}
.ta .chips{gap:6px}
.ta .foot{padding-top:8px;margin-top:2px}
.ta .btn{padding:5px 14px;font-size:13.5px;border-radius:9px}
.ta .hint{font-size:12px}
.tz .row{padding-top:4px;padding-bottom:4px;margin-top:4px}
.tb .c{font-size:13px;padding:4px 10px;border-radius:9px}
.tb .chips{gap:5px}
.tb .ql{margin-bottom:5px}
.tb .row{padding-top:5px;padding-bottom:5px;margin-top:5px}
.tb .inp{padding:6px 12px}
.tc .sub{display:none}
.tc .gh{display:none}
.tc .neu .row{padding-top:3px;padding-bottom:3px;margin-top:3px}
.tc .pair .qq{display:none}
.tc .main h2{font-size:20px}
/* Mehr Platz als nötig: Chips und Abstände werden größer (tl1, tl2), damit zwischen den Fragen keine großen Lücken bleiben. */
.tl1 .c{font-size:15px;padding:9px 16px;border-radius:12px}
.tl1 .chips{gap:10px}
.tl1 .qq{font-size:14.5px}
.tl1 .inp{padding:12px 16px}
.tl2 .c{font-size:16px;padding:12px 18px;border-radius:13px}
.tl2 .chips{gap:12px}
.tl2 .ql{font-size:19px}
.tl2 .qq{font-size:15px}
.tl2 .inp{padding:14px 18px}

/* ---------- ABSCHNITT 9: Ergebnisseite und Ladeanzeige ---------- */
.rh{display:flex;align-items:center;gap:18px;margin-top:6px}
.rh h2{flex:1}
.stats{display:flex;gap:8px}
.stat{background:var(--acc-bg);border-radius:11px;padding:5px 12px;text-align:center;line-height:1.15}
.stat b{display:block;font-size:20px;color:#0d6b46}
.stat span{font-size:11px;color:var(--mut)}
.stat.warn{background:#fff1ee}.stat.warn b{color:#c2410c}
.stop2{margin-top:10px;background:#fff1ee;border:1px solid #f3b5a8;color:#9a2f17;border-radius:11px;padding:8px 12px;font-size:13px}
.zl{display:flex;align-items:center;gap:10px;border-top:2px solid var(--gl);margin-top:10px;padding-top:8px;font-size:12px;color:var(--mut)}
.zl .sp{flex:1}
.rth{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:#8a94a3;font-weight:600;margin-top:10px}
.rt{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px;max-height:76px;overflow-y:auto}
.rt button{font:inherit;font-size:12.5px;font-weight:600;padding:4px 9px;white-space:nowrap;border-radius:99px;border:1px solid var(--line);background:#fff;color:var(--mut);cursor:pointer}
.rt button b{font-weight:600;color:var(--faint);margin-left:4px}
.rt button:hover{border-color:var(--faint)}
.rt button.on{background:var(--acc-bg);border-color:var(--acc);color:#0d6b46}
.rt button.on b{color:#0d6b46}
.tdl{list-style:none;flex:1;min-height:0;overflow-y:auto;margin-top:2px}
.tdl li{background:var(--acc-bg);border-radius:10px;margin-bottom:4px;padding:0 12px}
.tdl li:has(input:checked){opacity:.6}
.tdl summary{display:flex;align-items:center;gap:10px;padding:6px 0;cursor:pointer;list-style:none}
.tdl summary::-webkit-details-marker{display:none}
.tdl input{accent-color:var(--acc);width:15px;height:15px;flex:none}
.tdl summary b{flex:1;font-weight:600;font-size:13.5px;line-height:1.3;color:#0b3d2b}
.tdl li:has(input:checked) summary b{color:var(--faint);text-decoration:line-through}
.rf{font-size:10.5px;color:var(--mut);background:#f1f4f2;border:1px solid var(--line);border-radius:99px;padding:0 7px;white-space:nowrap}
.rf{background:#fff}
.rf.d{border-color:rgba(245,158,11,.5);color:#965a06}
.rf.ai{border-color:rgba(139,92,246,.45);color:#5a3fb0}
.rf.n{border-color:#cfd6dd;color:#55606f}
.laws .w.d{border-color:rgba(245,158,11,.45)}
.laws .w.d .wt i{background:rgba(245,158,11,.25);color:#f6c779}
.laws .w.ai{border-color:rgba(167,139,250,.5)}
.laws .w.ai .wt i{background:rgba(167,139,250,.28);color:#cdbcfb}
.tdl summary::after{content:"+";color:var(--faint);font-weight:600;width:14px;text-align:center}
.tdl details[open] summary::after{content:"\2013"}
.tdb{padding:0 0 11px 27px;font-size:13.5px;color:#3b4656}
.tdb p{margin-top:5px}
.tdb .k{font-weight:650;color:#0d4f37}
.ld{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid var(--acc-bg);border-top-color:var(--acc);animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ld ul{list-style:none;text-align:left;margin-top:6px}
.ld li{padding:3px 0;color:var(--faint);transition:color .3s}
.ld li::before{content:"\25CB";margin-right:9px}
.ld li.on{color:var(--ink)}
.ld li.on::before{content:"\2713";color:var(--acc);font-weight:700}
.laws .w ul{margin-left:0;font-size:12px}
.laws .w ul li{display:flex;gap:6px;padding:2px 4px;border-radius:6px;transition:background .25s,color .25s}
.laws .w ul li.hl{background:#1f5a44;color:#eaf7f0;font-weight:600}
.laws .wt{font-size:13.5px}
.side{overflow-y:auto}
/* ---------- ABSCHNITT 10: Wendekarte Checkliste / Gesetzestext ---------- */
.flip{flex:1;min-height:0;position:relative;perspective:1600px;margin-top:10px}
.fi{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.4,0,.2,1)}
.flip.turn .fi{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;background:var(--card)}
.face.back{transform:rotateY(180deg)}
.flip .zl{margin-top:0}
.tdb a.gz{color:#0d6b46;font-weight:600;text-decoration:underline;text-underline-offset:2px;cursor:pointer;white-space:nowrap}
.tdb a.gz:hover{color:var(--acc)}
.bk{display:flex;align-items:center;gap:10px;border-top:2px solid var(--gl);padding-top:8px;font-size:12px;color:var(--mut)}
.bk .sp{flex:1}
.zur{color:#0d6b46;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;text-decoration:underline;text-underline-offset:2px}
.lt{flex:1;min-height:0;overflow-y:auto;padding:4px 4px 8px 0}
.lt h4{font-size:15px;color:#0b3d2b;margin:12px 0 2px}
.lt h4 small{display:block;font-weight:400;color:var(--mut);font-size:12px}
.lt p{font-size:13px;line-height:1.5;color:#3b4656;margin-top:8px}
.lt .ln{display:block}
.lt .lb{padding-left:22px;text-indent:-16px;margin-top:3px}
.lt p b{color:#0d4f37}
.lt .fn{font-size:11.5px;color:var(--faint);margin-top:10px}
.lt .zur{display:inline-block;margin-top:12px}
/* „Notausgang: reicht selbst das Verkleinern nicht, scrollt nur die Karte innen.“ */
.main.scroll .cont{overflow-y:auto}
@media(max-width:900px){ .wrap{grid-template-columns:1fr} .main{padding:20px} }
@media(prefers-reduced-motion:reduce){ *{transition-duration:.01s!important} }
</style>
</head>
<body>

<header class="top">
  <svg width="30" height="30" viewBox="0 0 34 34" fill="none" aria-hidden="true"><rect x="1.5" y="1.5" width="31" height="31" rx="9" fill="#17382d" stroke="#2c6a52"/><circle cx="9" cy="17" r="3" fill="#5fe3c0"/><circle cx="25" cy="10" r="3" fill="#8be9a8"/><circle cx="25" cy="24" r="3" fill="#5fe3c0"/><path d="M12 16l10-5M12 18l10 5" stroke="#8aa0c8" stroke-width="1.5"/></svg>
  <h1>Rechtscheck für deinen KI-Workflow<small>DSGVO und EU AI Act</small></h1>
  <span class="sp"></span>
  <span class="pill">Demo mit festem Beispiel</span>
</header>

<main class="wrap">
  <section class="main"><div class="cont" id="cont"></div><div class="foot" id="foot"></div></section>
  <aside class="side" id="side"></aside>
</main>

<script>
// ---------- ABSCHNITT 1: Daten (aus der echten Demo, gekürzt auf Seite 1 und 2) ----------
// „Je Seite: Titel, ein Satz, Gesetz und die Fragen. Zwei Fragen in einer Zeile stehen nebeneinander.“
const SEITEN = [
  {t:"Projekt und Rolle", s:"Wer du im Projekt bist und wo der Workflow läuft.", law:"betrifft DSGVO und AI Act", rows:[
    [{id:"name", l:"Projektname", t:"text", info:"Erscheint als Titel im Ergebnis und im PDF."}],
    [{id:"text", l:"Projektbeschreibung", t:"text", info:"Max. 300 Zeichen. Schaltet nichts, hilft der KI nur beim Formulieren der Zusammenfassungen."}],
    [{id:"rolle", l:"Deine Rolle", q:"Wer entscheidet, wofür die Daten genutzt werden?", kind:"Eine Antwort",
      info:"Entscheidet der Kunde, bist du Auftragsverarbeiter. Entscheidest du selbst, bist du Verantwortlicher. Verkaufst du die KI-Lösung unter deinem Namen, bist du zusätzlich Anbieter im Sinne des AI Act.",
      o:[["avv","Mein Kunde, ich baue nur in seinem Auftrag"],["eigen","Ich selbst, mein eigenes Projekt"],["anbieter","Ich verkaufe die KI-Lösung an mehrere Kunden"],["unklar","Weiß ich nicht"]]}],
    [{id:"betrieb", l:"Server", q:"Wer verwaltet den Server, auf dem der Workflow läuft?", kind:"Eine Antwort",
      info:"Wer den Server verwaltet, ist für Zugriff, Backups, Updates und Verschlüsselung zuständig.",
      o:[["selbst","Ich selbst, Standort EU (z. B. Contabo Deutschland)"],["selbstx","Ich selbst, außerhalb der EU"],["kunde","Mein Kunde bzw. seine IT, Standort EU"],["kundex","Mein Kunde bzw. seine IT, außerhalb der EU"],["cloud","Cloud-Dienst (z. B. n8n Cloud)"],["unklar","Weiß ich nicht"]]}],

// „Die 11 To-dos der Demo (echtes Ergebnis von Testfall 09): Titel, Fundstelle, Ausloeser, Gesetz (D = DSGVO, AI = AI Act) und die drei Textteile.“
const TD = [{"t": "Unterauftragnehmer vom Kunden genehmigen lassen", "r": "DSGVO Art. 28 Abs. 2, 4, 9", "a": "Deine Rolle", "l": "D", "was": "Du setzt OpenAI, Automatisierungs-Plattform, deinen Server-Anbieter ein. Diese Dienste sehen die Daten deines Kunden. Dafür brauchst du vorher seine schriftliche Erlaubnis.", "wer": "Du schreibst die Anbieter als Liste in den AVV zwischen dir und dem Kunden (Anlage „Unterauftragnehmer“). Der Kunde unterschreibt, elektronisch reicht. Nirgends einreichen: Du legst den Vertrag in der Projektakte ab und zeigst ihn bei Bedarf vor. Den Vertrag mit den Anbietern selbst schließt du in deinem Konto (siehe AVV-Punkt); er muss ihnen dieselben Datenschutzpflichten auferlegen, die du gegenüber dem Kunden hast.", "why": "Der Kunde ist verantwortlich und muss wissen, wer seine Daten sieht. Bei jedem späteren Wechsel informierst du ihn vorher, er kann widersprechen."}, {"t": "AVV mit deinem Server-Anbieter abschließen", "r": "DSGVO Art. 28 Abs. 3 (Einschätzung)", "a": "Server", "l": "D", "was": "Du hostest auf einem gemieteten Server (z. B. Contabo, Hetzner). Der Server-Anbieter hat technisch Zugriff auf die Daten, die dort liegen. Schließe mit ihm einen AVV (viele Anbieter bieten ihn im Kundenkonto an).", "wer": "Du im Kundenkonto des Server-Anbieters. Vertrag in der Projektakte ablegen, bei Arbeit für einen Kunden Kopie an ihn.", "why": "Wer Daten im Auftrag verarbeitet, braucht einen Vertrag. Ob ein reiner Server-Vermieter darunter fällt, hängt vom Fall ab. Das ist eine Einschätzung und nicht an den Karten geprüft."}, {"t": "Prüfen, ob eine Folgenabschätzung nötig ist", "r": "DSGVO Art. 35 Abs. 1, 3, 4", "a": "Anzahl Betroffene", "l": "D", "was": "Laufender Betrieb mit vielen Personen allein löst keine Pflicht aus. Prüfe die drei Regelbeispiele (Bewertung von Personen mit Folgen, sensible Daten in großem Umfang, Überwachung öffentlicher Bereiche) und die Liste deiner Aufsichtsbehörde. Ergebnis mit Begründung festhalten.", "wer": "Der Kunde als Verantwortlicher, du lieferst die technischen Angaben. Ablage: Projektakte.", "why": "Bei voraussichtlich hohem Risiko muss die Abschätzung vor dem Start stehen."}, {"t": "Grundlage für den Datenfluss zu OpenAI klären", "r": "DSGVO Art. 44, 45, 46", "a": "KI-Modelle", "l": "D", "was": "Die Daten gehen an OpenAI, eine Firma in den USA. Prüfe, worauf sich das stützt: Gilt für den Anbieter ein Angemessenheitsbeschluss der EU-Kommission, oder stehen Standarddatenschutzklauseln im Vertrag (meist im Data Processing Addendum)?", "wer": "Du prüfst es im Vertragswerk des Anbieters und legst den Nachweis (PDF oder Link mit Datum) in der Projektakte ab. Der Kunde bekommt eine Kopie.", "why": "Ohne eine dieser Grundlagen ist die Übermittlung in ein Drittland nicht erlaubt."}, {"t": "Einwilligung nicht als Lösung einplanen", "r": "DSGVO Art. 49 Abs. 1 a", "a": "KI-Modelle", "l": "D", "was": "Plane nicht, die Betroffenen um Einwilligung in die Übermittlung zu bitten, um eine fehlende Grundlage zu ersetzen.", "wer": "Du, bei der Planung.", "why": "Die Einwilligung ist nur eine Ausnahme für Einzelfälle und setzt voraus, dass die Person vorher über die Risiken aufgeklärt wurde."}, {"t": "Datenschutzbeauftragten und Anwalt einbinden", "r": "Checkliste", "a": "KI-Modelle", "l": "D", "was": "Weil Daten außerhalb der EU verarbeitet werden, hol vor dem Bau eine Einschätzung ein. Mitgeben: Skizze des Datenflusses, Anbieter und Standorte, betroffene Personen, die Fundstellen aus diesem Guide, der schlimmste denkbare Fall.", "wer": "Der Kunde (sein Datenschutzbeauftragter, falls vorhanden). Du lieferst die Unterlagen.", "why": "Der Guide ist Orientierung, keine Rechtsberatung. Bei hohem Risiko entscheidet eine Fachperson."}, {"t": "EU-Serverstandort einstellen", "r": "Praxis", "a": "Standort der Anbieter", "l": "D", "was": "Wähle im Konto jedes Anbieters die EU-Region, soweit angeboten. Die Einstellung heißt oft „Region“ oder „Data Residency“.", "wer": "Du in den Konten der Anbieter. Screenshot der Einstellung in die Projektakte.", "why": "Weniger Datenabfluss. Ersetzt aber nicht die Grundlage aus dem Punkt davor, wenn die Firma in den USA sitzt."}, {"t": "AVV mit allen Diensten abschließen", "r": "DSGVO Art. 28 Abs. 3, 9", "a": "Datenschutzvertrag (AVV)", "l": "D", "was": "Mit OpenAI und der Automatisierungs-Plattform braucht es je einen Vertrag zur Auftragsverarbeitung (AVV), bevor der erste echte Datensatz fließt. Bei großen Anbietern ist das ein Online-Dokument (Data Processing Addendum), das du im Konto akzeptierst.", "wer": "Läuft der Dienst in deinem Konto, schließt du den Vertrag. Läuft er im Konto des Kunden, schließt ihn der Kunde. Ablage: Projektakte, Kopie an den Kunden.", "why": "Wer Daten im Auftrag verarbeitet, braucht einen schriftlichen Vertrag mit festen Inhalten: nur auf Weisung, Vertraulichkeit, Sicherheit, Löschen oder Rückgabe am Ende."}, {"t": "Training mit Kundendaten abstellen", "r": "DSGVO Art. 28 Abs. 3 a, Art. 29", "a": "Training", "l": "D", "was": "Laut deiner Antwort darf der Anbieter die Daten zum Training seiner KI nutzen. Stelle das ab: Opt-out im Konto setzen oder einen Tarif wählen, bei dem Training vertraglich ausgeschlossen ist.", "wer": "Du im Konto des Anbieters. Einstellung als Screenshot mit Datum in die Projektakte.", "why": "Ein Dienstleister darf Daten nur auf Weisung und nur für den Auftrag verarbeiten. Training für eigene Zwecke geht darüber hinaus."}, {"t": "KI-Hinweis zu Beginn einbauen", "r": "AI Act Art. 50 Abs. 1, 5", "a": "Wer sieht die KI", "l": "AI", "was": "Die erste Nachricht oder Ansage sagt klar, dass eine KI antwortet, z. B. „Sie schreiben mit einem KI-Assistenten.“", "wer": "Du im Workflow, im Begrüßungstext des Chats oder Sprachbots.", "why": "Menschen müssen spätestens bei der ersten Interaktion erkennen, dass sie mit einer KI sprechen, außer es ist offensichtlich."}, {"t": "Maßnahmen zur KI-Kompetenz ergreifen", "r": "AI Act Art. 4 Abs. 1", "a": "Gilt für jedes Projekt", "l": "AI", "was": "Wer beim Kunden mit dem KI-System arbeitet, soll ausreichend über Funktionsweise, Grenzen und Fehler Bescheid wissen, z. B. durch eine kurze Schulung.", "wer": "Der Kunde für seine Mitarbeiter, du kannst die Schulung liefern. Nachweis (Datum, Teilnehmer) ablegen.", "why": "Gilt für alle Anbieter und Betreiber von KI-Systemen, unabhängig vom Risiko. Ein bestimmtes Niveau muss nicht garantiert werden."}];

cy“).", "Du. Screenshot in die Projektakte.", "Weniger Datenabfluss, ersetzt aber nicht die Grundlage für Firmen in den USA.", []], "AVV mit allen Diensten abschließen": ["Akzeptiere bei jedem Dienst den AVV (Data Processing Addendum), bevor echte Daten fließen.", "Wer das Konto hat, du oder der Kunde. Ablage: Projektakte.", "Wer Daten im Auftrag verarbeitet, braucht einen schriftlichen Vertrag mit festen Inhalten.", [["DSGVO", "28", [3, 9]]]], "Training mit Kundendaten abstellen": ["Setze im Konto das Opt-out oder wähle einen Tarif ohne Training.", "Du. Screenshot mit Datum in die Projektakte.", "Ein Dienstleister darf Daten nur für den Auftrag nutzen, nicht für eigenes Training.", [["DSGVO", "28", [3]], ["DSGVO", "29", []]]], "KI-Hinweis zu Beginn einbauen": ["Die erste Nachricht sagt klar, dass eine KI antwortet.", "Du, im Begrüßungstext des Bots.", "Menschen müssen erkennen, dass sie mit einer KI sprechen, außer es ist offensichtlich.", [["EU AI Act", "50", [1, 5]]]], "Maßnahmen zur KI-Kompetenz ergreifen": ["Schule alle, die beim Kunden mit der KI arbeiten, kurz zu Funktion, Grenzen und Fehlern.", "Der Kunde, du kannst die Schulung liefern.", "Gilt für alle Anbieter und Betreiber von KI-Systemen, unabhängig vom Risiko.", [["EU AI Act", "4", []]]]};

// „Originaltexte der Artikel (aus den Gesetzeskarten der Demo): Titel t und Text c mit Absätzen (1), (2) …“
const LT = {"DSGVO|28": {"t": "Auftragsverarbeiter", "c": "(1) Erfolgt eine Verarbeitung im Auftrag eines Verantwortlichen, so arbeitet dieser nur mit Auftragsverarbeitern, die hinreichend Garantien dafür bieten, dass geeignete technische und organisatorische Maßnahmen so durchgeführt werden, dass die Verarbeitung im Einklang mit den Anforderungen dieser Verordnung erfolgt und den Schutz der Rechte der betroffenen Person gewährleistet.\n(2) Der Auftragsverarbeiter nimmt keinen weiteren Auftragsverarbeiter ohne vorherige gesonderte oder allgemeine schriftliche Genehmigung des Verantwortlichen in Anspruch. Im Fall einer allgemeinen schriftlichen Genehmigung informiert der Auftragsverarbeiter den Verantwortlichen immer über jede beabsichtigte Änderung in Bezug auf die Hinzuziehung oder die Ersetzung anderer Auftragsverarbeiter, wodurch der Verantwortliche die Möglichkeit erhält, gegen derartige Änderungen Einspruch zu erheben.\n(3) Die Verarbeitung durch einen Auftragsverarbeiter erfolgt auf der Grundlage eines Vertrags oder eines anderen Rechtsinstruments nach dem Unionsrecht oder dem Recht der Mitgliedstaaten, der bzw. das den Auftragsverarbeiter in Bezug auf den Verantwortlichen bindet und in dem Gegenstand und Dauer der Verarbeitung, Art und Zweck der Verarbeitung, die Art der personenbezogenen Daten, die Kategorien betroffener Personen und die Pflichten und Rechte des Verantwortlichen festgelegt sind. Dieser Vertrag bzw. dieses andere Rechtsinstrument sieht insbesondere vor, dass der Auftragsverarbeiter\na) die personenbezogenen Daten nur auf dokumentierte Weisung des Verantwortlichen — auch in Bezug auf die Übermittlung personenbezogener Daten an ein Drittland oder eine internationale Organisation — verarbeitet, sofern er nicht durch das Recht der Union oder der Mitgliedstaaten, dem der Auftragsverarbeiter unterliegt, hierzu verpflichtet ist; in einem solchen Fall teilt der Auftragsverarbeiter dem Verantwortlichen diese rechtlichen Anforderungen vor der Verarbeitung mit, sofern das betreffende Recht eine solche Mitteilung nicht wegen eines wichtigen öffentlichen Interesses verbietet;\nb) gewährleistet, dass sich die zur Verarbeitung der personenbezogenen Daten befugten Personen zur Vertraulichkeit verpflichtet haben oder einer angemessenen gesetzlichen Verschwiegenheitspflicht unterliegen;\nc) alle gemäß Artikel 32 erforderlichen Maßnahmen ergreift;\nd) die in den Absätzen 2 und 4 genannten Bedingungen für die Inanspruchnahme der Dienste eines weiteren Auftragsverarbeiters einhält;\ne) angesichts der Art der Verarbeitung den Verantwortlichen nach Möglichkeit mit geeigneten technischen und organisatorischen Maßnahmen dabei unterstützt, seiner Pflicht zur Beantwortung von Anträgen auf Wahrnehmung der in Kapitel III genannten Rechte der betroffenen Person nachzukommen;\nf) unter Berücksichtigung der Art der Verarbeitung und der ihm zur Verfügung stehenden Informationen den Verantwortlichen bei der Einhaltung der in den Artikeln 32 bis 36 genannten Pflichten unterstützt;\ng) nach Abschluss der Erbringung der Verarbeitungsleistungen alle personenbezogenen Daten nach Wahl des Verantwortlichen entweder löscht oder zurückgibt, sofern nicht nach dem Unionsrecht oder dem Recht der Mitgliedstaaten eine Verpflichtung zur Speicherung der personenbezogenen Daten besteht;\nh) dem Verantwortlichen alle erforderlichen Informationen zum Nachweis der Einhaltung der in diesem Artikel niedergelegten Pflichten zur Verfügung stellt und Überprüfungen — einschließlich Inspektionen –, die vom Verantwortlichen oder einem anderen von diesem beauftragten Prüfer durchgeführt werden, ermöglicht und dazu beiträgt.\nMit Blick auf Unterabsatz 1 Buchstabe h informiert der Auftragsverarbeiter den Verantwortlichen unverzüglich, falls er der Auffassung ist, dass eine Weisung gegen diese Verordnung oder gegen andere Datenschutzbestimmungen der Union oder der Mitgliedstaaten verstößt.\n\n(4) Nimmt der Auftragsverarbeiter die Dienste eines weiteren Auftragsverarbeiters in Anspruch, um bestimmte Verarbeitungstätigkeiten im Namen des Verantwortlichen auszuführen, so werden diesem weiteren Auftragsverarbeiter im Wege eines Vertrags oder eines anderen Rechtsinstruments nach dem Unionsrecht oder dem Recht des betreffenden Mitgliedstaats dieselben Datenschutzpflichten auferlegt, die in dem Vertrag oder anderen Rechtsinstrument zwischen dem Verantwortlichen und dem Auftragsverarbeiter gemäß Absatz 3 festgelegt sind, wobei insbesondere hinreichende Garantien dafür geboten werden muss, dass die geeigneten technischen und organisatorischen Maßnahmen so durchgeführt werden, dass die Verarbeitung entsprechend den Anforderungen dieser Verordnung erfolgt. Kommt der weitere Auftragsverarbeiter seinen Datenschutzpflichten nicht nach, so haftet der erste Auftragsverarbeiter gegenüber dem Verantwortlichen für die Einhaltung der Pflichten jenes anderen Auftragsverarbeiters.\n(5) Die Einhaltung genehmigter Verhaltensregeln gemäß Artikel 40 oder eines genehmigten Zertifizierungsverfahrens gemäß Artikel 42 durch einen Auftragsverarbeiter kann als Faktor herangezogen werden, um hinreichende Garantien im Sinne der Absätze 1 und 4 des vorliegenden Artikels nachzuweisen.\n(6) Unbeschadet eines individuellen Vertrags zwischen dem Verantwortlichen und dem Auftragsverarbeiter kann der Vertrag oder das andere Rechtsinstrument im Sinne der Absätze 3 und 4 des vorliegenden Artikels ganz oder teilweise auf den in den Absätzen 7 und 8 des vorliegenden Artikels genannten Standardvertragsklauseln beruhen, auch wenn diese Bestandteil einer dem Verantwortlichen oder dem Auftragsverarbeiter gemäß den Artikeln 42 und 43 erteilten Zertifizierung sind.\n(7) Die Kommission kann im Einklang mit dem Prüfverfahren gemäß Artikel 87 Absatz 2 Standardvertragsklauseln zur Regelung der in den Absätzen 3 und 4 des vorliegenden Artikels genannten Fragen festlegen.\n(8) Eine Aufsichtsbehörde kann im Einklang mit dem Kohärenzverfahren gemäß Artikel 63 Standardvertragsklauseln zur Regelung der in den Absätzen 3 und 4 des vorliegenden Artikels genannten Fragen festlegen.\n(9) Der Vertrag oder das andere Rechtsinstrument im Sinne der Absätze 3 und 4 ist schriftlich abzufassen, was auch in einem elektronischen Format erfolgen kann.\n(10) Unbeschadet der Artikel 82, 83 und 84 gilt ein Auftragsverarbeiter, der unter Verstoß gegen diese Verordnung die Zwecke und Mittel der Verarbeitung bestimmt, in Bezug auf diese Verarbeitung als Verantwortlicher."}, "DSGVO|29": {"t": "Verarbeitung unter der Aufsicht des Verantwortlichen oder des Auftragsverarbeiters", "c": "Der Auftragsverarbeiter und jede dem Verantwortlichen oder dem Auftragsverarbeiter unterstellte Person, die Zugang zu personenbezogenen Daten hat, dürfen diese Daten ausschließlich auf Weisung des Verantwortlichen verarbeiten, es sei denn, dass sie nach dem Unionsrecht oder dem Recht der Mitgliedstaaten zur Verarbeitung verpflichtet sind."}, "DSGVO|35": {"t": "Datenschutz-Folgenabschätzung", "c": "(1) Hat eine Form der Verarbeitung, insbesondere bei Verwendung neuer Technologien, aufgrund der Art, des Umfangs, der Umstände und der Zwecke der Verarbeitung voraussichtlich ein hohes Risiko für die Rechte und Freiheiten natürlicher Personen zur Folge, so führt der Verantwortliche vorab eine Abschätzung der Folgen der vorgesehenen Verarbeitungsvorgänge für den Schutz personenbezogener Daten durch. Für die Untersuchung mehrerer ähnlicher Verarbeitungsvorgänge mit ähnlich hohen Risiken kann eine einzige Abschätzung vorgenommen werden.\n(2) Der Verantwortliche holt bei der Durchführung einer Datenschutz-Folgenabschätzung den Rat des Datenschutzbeauftragten, sofern ein solcher benannt wurde, ein.\n(3) Eine Datenschutz-Folgenabschätzung gemäß Absatz 1 ist insbesondere in folgenden Fällen erforderlich:\na) systematische und umfassende Bewertung persönlicher Aspekte natürlicher Personen, die sich auf automatisierte Verarbeitung einschließlich Profiling gründet und die ihrerseits als Grundlage für Entscheidungen dient, die Rechtswirkung gegenüber natürlichen Personen entfalten oder diese in ähnlich erheblicher Weise beeinträchtigen;\nb) umfangreiche Verarbeitung besonderer Kategorien von personenbezogenen Daten gemäß Artikel 9 Absatz 1 oder von personenbezogenen Daten über strafrechtliche Verurteilungen und Straftaten gemäß Artikel 10 oder\nc) systematische umfangreiche Überwachung öffentlich zugänglicher Bereiche.\n(4) Die Aufsichtsbehörde erstellt eine Liste der Verarbeitungsvorgänge, für die gemäß Absatz 1 eine Datenschutz-Folgenabschätzung durchzuführen ist, und veröffentlicht diese. Die Aufsichtsbehörde übermittelt diese Listen dem in Artikel 68 genannten Ausschuss.\n(5) Die Aufsichtsbehörde kann des Weiteren eine Liste der Arten von Verarbeitungsvorgängen erstellen und veröffentlichen, für die keine Datenschutz-Folgenabschätzung erforderlich ist. Die Aufsichtsbehörde übermittelt diese Listen dem Ausschuss.\n(6) Vor Festlegung der in den Absätzen 4 und 5 genannten Listen wendet die zuständige Aufsichtsbehörde das Kohärenzverfahren gemäß Artikel 63 an, wenn solche Listen Verarbeitungstätigkeiten umfassen, die mit dem Angebot von Waren oder Dienstleistungen für betroffene Personen oder der Beobachtung des Verhaltens dieser Personen in mehreren Mitgliedstaaten im Zusammenhang stehen oder die den freien Verkehr personenbezogener Daten innerhalb der Union erheblich beeinträchtigen könnten.\n(7) Die Folgenabschätzung enthält zumindest Folgendes:\na) eine systematische Beschreibung der geplanten Verarbeitungsvorgänge und der Zwecke der Verarbeitung, gegebenenfalls einschließlich der von dem Verantwortlichen verfolgten berechtigten Interessen;\nb) eine Bewertung der Notwendigkeit und Verhältnismäßigkeit der Verarbeitungsvorgänge in Bezug auf den Zweck;\nc) eine Bewertung der Risiken für die Rechte und Freiheiten der betroffenen Personen gemäß Absatz 1 und\nd) die zur Bewältigung der Risiken geplanten Abhilfemaßnahmen, einschließlich Garantien, Sicherheitsvorkehrungen und Verfahren, durch die der Schutz personenbezogener Daten sichergestellt und der Nachweis dafür erbracht wird, dass diese Verordnung eingehalten wird, wobei den Rechten und berechtigten Interessen der betroffenen Personen und sonstiger Betroffener Rechnung getragen wird.\n(8) Die Einhaltung genehmigter Verhaltensregeln gemäß Artikel 40 durch die zuständigen Verantwortlichen oder die zuständigen Auftragsverarbeiter ist bei der Beurteilung der Auswirkungen der von diesen durchgeführten Verarbeitungsvorgänge, insbesondere für die Zwecke einer Datenschutz-Folgenabschätzung, gebührend zu berücksichtigen.\n(9) Der Verantwortliche holt gegebenenfalls den Standpunkt der betroffenen Personen oder ihrer Vertreter zu der beabsichtigten Verarbeitung unbeschadet des Schutzes gewerblicher oder öffentlicher Interessen oder der Sicherheit der Verarbeitungsvorgänge ein.\n\n(10) Falls die Verarbeitung gemäß Artikel 6 Absatz 1 Buchstabe c oder e auf einer Rechtsgrundlage im Unionsrecht oder im Recht des Mitgliedstaats, dem der Verantwortliche unterliegt, beruht und falls diese Rechtsvorschriften den konkreten Verarbeitungsvorgang oder die konkreten Verarbeitungsvorgänge regeln und bereits im Rahmen der allgemeinen Folgenabschätzung im Zusammenhang mit dem Erlass dieser Rechtsgrundlage eine Datenschutz-Folgenabschätzung erfolgte, gelten die Absätze 1 bis 7 nur, wenn es nach dem Ermessen der Mitgliedstaaten erforderlich ist, vor den betreffenden Verarbeitungstätigkeiten eine solche Folgenabschätzung durchzuführen.\n(11) Erforderlichenfalls führt der Verantwortliche eine Überprüfung durch, um zu bewerten, ob die Verarbeitung gemäß der Datenschutz-Folgenabschätzung durchgeführt wird; dies gilt zumindest, wenn hinsichtlich des mit den Verarbeitungsvorgängen verbundenen Risikos Änderungen eingetreten sind."}, "DSGVO|44": {"t": "Allgemeine Grundsätze der Datenübermittlung", "c": "Jedwede Übermittlung personenbezogener Daten, die bereits verarbeitet werden oder nach ihrer Übermittlung an ein Drittland oder eine internationale Organisation verarbeitet werden sollen, ist nur zulässig, wenn der Verantwortliche und der Auftragsverarbeiter die in diesem Kapitel niedergelegten Bedingungen einhalten und auch die sonstigen Bestimmungen dieser Verordnung eingehalten werden; dies gilt auch für die etwaige Weiterübermittlung personenbezogener Daten durch das betreffende Drittland oder die betreffende internationale Organisation an ein anderes Drittland oder eine andere internationale Organisation. Alle Bestimmungen dieses Kapitels sind anzuwenden, um sicherzustellen, dass das durch diese Verordnung gewährleistete Schutzniveau für natürliche Personen nicht untergraben wird."}, "DSGVO|45": {"t": "Datenübermittlung auf der Grundlage eines Angemessenheitsbeschlusses", "c": "(1) Eine Übermittlung personenbezogener Daten an ein Drittland oder eine internationale Organisation darf vorgenommen werden, wenn die Kommission beschlossen hat, dass das betreffende Drittland, ein Gebiet oder ein oder mehrere spezifische Sektoren in diesem Drittland oder die betreffende internationale Organisation ein angemessenes Schutzniveau bietet. Eine solche Datenübermittlung bedarf keiner besonderen Genehmigung.\n(2) Bei der Prüfung der Angemessenheit des gebotenen Schutzniveaus berücksichtigt die Kommission insbesondere das Folgende:\na) die Rechtsstaatlichkeit, die Achtung der Menschenrechte und Grundfreiheiten, die in dem betreffenden Land bzw. bei der betreffenden internationalen Organisation geltenden einschlägigen Rechtsvorschriften sowohl allgemeiner als auch sektoraler Art — auch in Bezug auf öffentliche Sicherheit, Verteidigung, nationale Sicherheit und Strafrecht sowie Zugang der Behörden zu personenbezogenen Daten — sowie die Anwendung dieser Rechtsvorschriften, Datenschutzvorschriften, Berufsregeln und Sicherheitsvorschriften einschließlich der Vorschriften für die Weiterübermittlung personenbezogener Daten an ein anderes Drittland bzw. eine andere internationale Organisation, die Rechtsprechung sowie wirksame und durchsetzbare Rechte der betroffenen Person und wirksame verwaltungsrechtliche und gerichtliche Rechtsbehelfe für betroffene Personen, deren personenbezogene Daten übermittelt werden,\nb) die Existenz und die wirksame Funktionsweise einer oder mehrerer unabhängiger Aufsichtsbehörden in dem betreffenden Drittland oder denen eine internationale Organisation untersteht und die für die Einhaltung und Durchsetzung der Datenschutzvorschriften, einschließlich angemessener Durchsetzungsbefugnisse, für die Unterstützung und Beratung der betroffenen Personen bei der Ausübung ihrer Rechte und für die Zusammenarbeit mit den Aufsichtsbehörden der Mitgliedstaaten zuständig sind, und\nc) die von dem betreffenden Drittland bzw. der betreffenden internationalen Organisation eingegangenen internationalen Verpflichtungen oder andere Verpflichtungen, die sich aus rechtsverbindlichen Übereinkünften oder Instrumenten sowie aus der Teilnahme des Drittlands oder der internationalen Organisation an multilateralen oder regionalen Systemen insbesondere in Bezug auf den Schutz personenbezogener Daten ergeben.\n(3) Nach der Beurteilung der Angemessenheit des Schutzniveaus kann die Kommission im Wege eines Durchführungsrechtsaktes beschließen, dass ein Drittland, ein Gebiet oder ein oder mehrere spezifische Sektoren in einem Drittland oder eine internationale Organisation ein angemessenes Schutzniveau im Sinne des Absatzes 2 des vorliegenden Artikels bieten. In dem Durchführungsrechtsakt ist ein Mechanismus für eine regelmäßige Überprüfung, die mindestens alle vier Jahre erfolgt, vorzusehen, bei der allen maßgeblichen Entwicklungen in dem Drittland oder bei der internationalen Organisation Rechnung getragen wird. Im Durchführungsrechtsakt werden der territoriale und der sektorale Anwendungsbereich sowie gegebenenfalls die in Absatz 2 Buchstabe b des vorliegenden Artikels genannte Aufsichtsbehörde bzw. genannten Aufsichtsbehörden angegeben. Der Durchführungsrechtsakt wird gemäß dem in Artikel 93 Absatz 2 genannten Prüfverfahren erlassen.\n(4) Die Kommission überwacht fortlaufend die Entwicklungen in Drittländern und bei internationalen Organisationen, die die Wirkungsweise der nach Absatz 3 des vorliegenden Artikels erlassenen Beschlüsse und der nach Artikel 25 Absatz 6 der Richtlinie 95/46/EG erlassenen Feststellungen beeinträchtigen könnten.\n\n(5) Die Kommission widerruft, ändert oder setzt die in Absatz 3 des vorliegenden Artikels genannten Beschlüsse im Wege von Durchführungsrechtsakten aus, soweit dies nötig ist und ohne rückwirkende Kraft, soweit entsprechende Informationen — insbesondere im Anschluss an die in Absatz 3 des vorliegenden Artikels genannte Überprüfung — dahingehend vorliegen, dass ein Drittland, ein Gebiet oder ein oder mehrere spezifischer Sektor in einem Drittland oder eine internationale Organisation kein angemessenes Schutzniveau im Sinne des Absatzes 2 des vorliegenden Artikels mehr gewährleistet. Diese Durchführungsrechtsakte werden gemäß dem Prüfverfahren nach Artikel 93 Absatz 2 erlassen.\nIn hinreichend begründeten Fällen äußerster Dringlichkeit erlässt die Kommission gemäß dem in Artikel 93 Absatz 3 genannten Verfahren sofort geltende Durchführungsrechtsakte.\n(6) Die Kommission nimmt Beratungen mit dem betreffenden Drittland bzw. der betreffenden internationalen Organisation auf, um Abhilfe für die Situation zu schaffen, die zu dem gemäß Absatz 5 erlassenen Beschluss geführt hat.\n(7) Übermittlungen personenbezogener Daten an das betreffende Drittland, das Gebiet oder einen oder mehrere spezifische Sektoren in diesem Drittland oder an die betreffende internationale Organisation gemäß den Artikeln 46 bis 49 werden durch einen Beschluss nach Absatz 5 des vorliegenden Artikels nicht berührt.\n(8) Die Kommission veröffentlicht im \nAmtsblatt der Europäischen Union\n und auf ihrer Website eine Liste aller Drittländer beziehungsweise Gebiete und spezifischen Sektoren in einem Drittland und aller internationalen Organisationen, für die sie durch Beschluss festgestellt hat, dass sie ein angemessenes Schutzniveau gewährleisten bzw. nicht mehr gewährleisten.\n(9) Von der Kommission auf der Grundlage von Artikel 25 Absatz 6 der Richtlinie 95/46/EG erlassene Feststellungen bleiben so lange in Kraft, bis sie durch einen nach dem Prüfverfahren gemäß den Absätzen 3 oder 5 des vorliegenden Artikels erlassenen Beschluss der Kommission geändert, ersetzt oder aufgehoben werden."}, "DSGVO|46": {"t": "Datenübermittlung vorbehaltlich geeigneter Garantien", "c": "(1) Falls kein Beschluss nach Artikel 45 Absatz 3 vorliegt, darf ein Verantwortlicher oder ein Auftragsverarbeiter personenbezogene Daten an ein Drittland oder eine internationale Organisation nur übermitteln, sofern der Verantwortliche oder der Auftragsverarbeiter geeignete Garantien vorgesehen hat und sofern den betroffenen Personen durchsetzbare Rechte und wirksame Rechtsbehelfe zur Verfügung stehen.\n(2) Die in Absatz 1 genannten geeigneten Garantien können, ohne dass hierzu eine besondere Genehmigung einer Aufsichtsbehörde erforderlich wäre, bestehen in\na) einem rechtlich bindenden und durchsetzbaren Dokument zwischen den Behörden oder öffentlichen Stellen,\nb) verbindlichen internen Datenschutzvorschriften gemäß Artikel 47,\nc) Standarddatenschutzklauseln, die von der Kommission gemäß dem Prüfverfahren nach Artikel 93 Absatz 2 erlassen werden,\nd) von einer Aufsichtsbehörde angenommenen Standarddatenschutzklauseln, die von der Kommission gemäß dem Prüfverfahren nach Artikel 93 Absatz 2 genehmigt wurden,\ne) genehmigten Verhaltensregeln gemäß Artikel 40 zusammen mit rechtsverbindlichen und durchsetzbaren Verpflichtungen des Verantwortlichen oder des Auftragsverarbeiters in dem Drittland zur Anwendung der geeigneten Garantien, einschließlich in Bezug auf die Rechte der betroffenen Personen, oder\nf) einem genehmigten Zertifizierungsmechanismus gemäß Artikel 42 zusammen mit rechtsverbindlichen und durchsetzbaren Verpflichtungen des Verantwortlichen oder des Auftragsverarbeiters in dem Drittland zur Anwendung der geeigneten Garantien, einschließlich in Bezug auf die Rechte der betroffenen Personen.\n(3) Vorbehaltlich der Genehmigung durch die zuständige Aufsichtsbehörde können die geeigneten Garantien gemäß Absatz 1 auch insbesondere bestehen in\na) Vertragsklauseln, die zwischen dem Verantwortlichen oder dem Auftragsverarbeiter und dem Verantwortlichen, dem Auftragsverarbeiter oder dem Empfänger der personenbezogenen Daten im Drittland oder der internationalen Organisation vereinbart wurden, oder\nb) Bestimmungen, die in Verwaltungsvereinbarungen zwischen Behörden oder öffentlichen Stellen aufzunehmen sind und durchsetzbare und wirksame Rechte für die betroffenen Personen einschließen.\n(4) Die Aufsichtsbehörde wendet das Kohärenzverfahren nach Artikel 63 an, wenn ein Fall gemäß Absatz 3 des vorliegenden Artikels vorliegt.\n(5) Von einem Mitgliedstaat oder einer Aufsichtsbehörde auf der Grundlage von Artikel 26 Absatz 2 der Richtlinie 95/46/EG erteilte Genehmigungen bleiben so lange gültig, bis sie erforderlichenfalls von dieser Aufsichtsbehörde geändert, ersetzt oder aufgehoben werden. Von der Kommission auf der Grundlage von Artikel 26 Absatz 4 der Richtlinie 95/46/EG erlassene Feststellungen bleiben so lange in Kraft, bis sie erforderlichenfalls mit einem nach Absatz 2 des vorliegenden Artikels erlassenen Beschluss der Kommission geändert, ersetzt oder aufgehoben werden."}, "DSGVO|49": {"t": "Ausnahmen für bestimmte Fälle", "c": "(1) Falls weder ein Angemessenheitsbeschluss nach Artikel 45 Absatz 3 vorliegt noch geeignete Garantien nach Artikel 46, einschließlich verbindlicher interner Datenschutzvorschriften, bestehen, ist eine Übermittlung oder eine Reihe von Übermittlungen personenbezogener Daten an ein Drittland oder an eine internationale Organisation nur unter einer der folgenden Bedingungen zulässig:\na) die betroffene Person hat in die vorgeschlagene Datenübermittlung ausdrücklich eingewilligt, nachdem sie über die für sie bestehenden möglichen Risiken derartiger Datenübermittlungen ohne Vorliegen eines Angemessenheitsbeschlusses und ohne geeignete Garantien unterrichtet wurde,\nb) die Übermittlung ist für die Erfüllung eines Vertrags zwischen der betroffenen Person und dem Verantwortlichen oder zur Durchführung von vorvertraglichen Maßnahmen auf Antrag der betroffenen Person erforderlich,\nc) die Übermittlung ist zum Abschluss oder zur Erfüllung eines im Interesse der betroffenen Person von dem Verantwortlichen mit einer anderen natürlichen oder juristischen Person geschlossenen Vertrags erforderlich,\nd) die Übermittlung ist aus wichtigen Gründen des öffentlichen Interesses notwendig,\ne) die Übermittlung ist zur Geltendmachung, Ausübung oder Verteidigung von Rechtsansprüchen erforderlich,\nf) die Übermittlung ist zum Schutz lebenswichtiger Interessen der betroffenen Person oder anderer Personen erforderlich, sofern die betroffene Person aus physischen oder rechtlichen Gründen außerstande ist, ihre Einwilligung zu geben,\ng) die Übermittlung erfolgt aus einem Register, das gemäß dem Recht der Union oder der Mitgliedstaaten zur Information der Öffentlichkeit bestimmt ist und entweder der gesamten Öffentlichkeit oder allen Personen, die ein berechtigtes Interesse nachweisen können, zur Einsichtnahme offensteht, aber nur soweit die im Recht der Union oder der Mitgliedstaaten festgelegten Voraussetzungen für die Einsichtnahme im Einzelfall gegeben sind.\nFalls die Übermittlung nicht auf eine Bestimmung der Artikel 45 oder 46 — einschließlich der verbindlichen internen Datenschutzvorschriften — gestützt werden könnte und keine der Ausnahmen für einen bestimmten Fall gemäß dem ersten Unterabsatz anwendbar ist, darf eine Übermittlung an ein Drittland oder eine internationale Organisation nur dann erfolgen, wenn die Übermittlung nicht wiederholt erfolgt, nur eine begrenzte Zahl von betroffenen Personen betrifft, für die Wahrung der zwingenden berechtigten Interessen des Verantwortlichen erforderlich ist, sofern die Interessen oder die Rechte und Freiheiten der betroffenen Person nicht überwiegen, und der Verantwortliche alle Umstände der Datenübermittlung beurteilt und auf der Grundlage dieser Beurteilung geeignete Garantien in Bezug auf den Schutz personenbezogener Daten vorgesehen hat. Der Verantwortliche setzt die Aufsichtsbehörde von der Übermittlung in Kenntnis. Der Verantwortliche unterrichtet die betroffene Person über die Übermittlung und seine zwingenden berechtigten Interessen; dies erfolgt zusätzlich zu den der betroffenen Person nach den Artikeln 13 und 14 mitgeteilten Informationen.\n(2) Datenübermittlungen gemäß Absatz 1 Unterabsatz 1 Buchstabe g dürfen nicht die Gesamtheit oder ganze Kategorien der im Register enthaltenen personenbezogenen Daten umfassen. Wenn das Register der Einsichtnahme durch Personen mit berechtigtem Interesse dient, darf die Übermittlung nur auf Anfrage dieser Personen oder nur dann erfolgen, wenn diese Personen die Adressaten der Übermittlung sind.\n(3) Absatz 1 Unterabsatz 1 Buchstaben a, b und c und sowie Absatz 1 Unterabsatz 2 gelten nicht für Tätigkeiten, die Behörden in Ausübung ihrer hoheitlichen Befugnisse durchführen.\n(4) Das öffentliche Interesse im Sinne des Absatzes 1 Unterabsatz 1 Buchstabe d muss im Unionsrecht oder im Recht des Mitgliedstaats, dem der Verantwortliche unterliegt, anerkannt sein.\n\n(5) Liegt kein Angemessenheitsbeschluss vor, so können im Unionsrecht oder im Recht der Mitgliedstaaten aus wichtigen Gründen des öffentlichen Interesses ausdrücklich Beschränkungen der Übermittlung bestimmter Kategorien von personenbezogenen Daten an Drittländer oder internationale Organisationen vorgesehen werden. Die Mitgliedstaaten teilen der Kommission derartige Bestimmungen mit.\n(6) Der Verantwortliche oder der Auftragsverarbeiter erfasst die von ihm vorgenommene Beurteilung sowie die angemessenen Garantien im Sinne des Absatzes 1 Unterabsatz 2 des vorliegenden Artikels in der Dokumentation gemäß Artikel 30."}, "EU AI Act|4": {"t": "KI-Kompetenz", "c": "(1) Die Anbieter und Betreiber von KI-Systemen ergreifen Maßnahmen, um die Entwicklung der KI-Kompetenz ihres Personals und anderer Personen zu unterstützen, die in ihrem Auftrag mit dem Betrieb und der Nutzung von KI-Systemen befasst sind, wobei ihre technischen Kenntnisse, ihre Erfahrung, ihre Aus- und Fortbildung und der Kontext, in dem die KI-Systeme eingesetzt werden sollen, sowie die Personen oder Personengruppen, bei denen die KI-Systeme eingesetzt werden sollen, zu berücksichtigen sind. Diese Verpflichtung verpflichtet Anbieter oder Betreiber nicht, für irgendeine Person ein bestimmtes Niveau an KI-Kompetenz zu garantieren.\n(2) Die Kommission und die Mitgliedstaaten unterstützen und fördern die Bemühungen der Anbieter und Betreiber von KI-Systemen und insbesondere von KMU, ihre Verpflichtung nach Absatz 1 dieses Artikels zu erfüllen. Zu diesem Zweck veröffentlicht die Kommission praktische Beispiele dafür, wie diese Verpflichtung erfüllt wird auf der in Artikel 62 Absatz 3 Buchstabe b genannten zentralen Informationsplattform.\n(3) Das KI-Gremium nimmt unter Berücksichtigung der europäischen Kompetenzrahmen Empfehlungen an, um die Kommission und die Mitgliedstaaten unter anderem durch die Festlegung gemeinsamer Ziele bei der Förderung der KI-Kompetenz gemäß Absatz 1 zu unterstützen."}, "EU AI Act|50": {"t": "Transparenzpflichten für Anbieter und Betreiber bestimmter KI-Systeme", "c": "(1) Die Anbieter stellen sicher, dass KI-Systeme, die für die direkte Interaktion mit natürlichen Personen bestimmt sind, so konzipiert und entwickelt werden, dass die betreffenden natürlichen Personen informiert werden, dass sie mit einem KI-System interagieren, es sei denn, dies ist aus Sicht einer angemessen informierten, aufmerksamen und verständigen natürlichen Person aufgrund der Umstände und des Kontexts der Nutzung offensichtlich. Diese Pflicht gilt nicht für gesetzlich zur Aufdeckung, Verhütung, Ermittlung oder Verfolgung von Straftaten zugelassene KI-Systeme, wenn geeignete Schutzvorkehrungen für die Rechte und Freiheiten Dritter bestehen, es sei denn, diese Systeme stehen der Öffentlichkeit zur Anzeige einer Straftat zur Verfügung.\n(2) Anbieter von KI-Systemen, einschließlich KI-Systemen mit allgemeinem Verwendungszweck, die synthetische Audio-, Bild-, Video- oder Textinhalte erzeugen, stellen sicher, dass die Ausgaben des KI-Systems in einem maschinenlesbaren Format gekennzeichnet und als künstlich erzeugt oder manipuliert erkennbar sind. Die Anbieter sorgen dafür, dass — soweit technisch möglich — ihre technischen Lösungen wirksam, interoperabel, belastbar und zuverlässig sind und berücksichtigen dabei die Besonderheiten und Beschränkungen der verschiedenen Arten von Inhalten, die Umsetzungskosten und den allgemein anerkannten Stand der Technik, wie er in den einschlägigen technischen Normen zum Ausdruck kommen kann. Diese Pflicht gilt nicht, soweit die KI-Systeme eine unterstützende Funktion für die Standardbearbeitung ausführen oder die vom Betreiber bereitgestellten Eingabedaten oder deren Semantik nicht wesentlich verändern oder wenn sie zur Aufdeckung, Verhütung, Ermittlung oder Verfolgung von Straftaten gesetzlich zugelassen sind.\n(3) Die Betreiber eines Emotionserkennungssystems oder eines Systems zur biometrischen Kategorisierung informieren die davon betroffenen natürlichen Personen über den Betrieb des Systems und verarbeiten personenbezogene Daten gemäß den Verordnungen (EU) 2016/679 und (EU) 2018/1725 und der Richtlinie (EU) 2016/680. Diese Pflicht gilt nicht für gesetzlich zur Aufdeckung, Verhütung oder Ermittlung von Straftaten zugelassene KI-Systeme, die zur biometrischen Kategorisierung und Emotionserkennung im Einklang mit dem Unionsrecht verwendet werden, sofern geeignete Schutzvorkehrungen für die Rechte und Freiheiten Dritter bestehen.\n(4) Betreiber eines KI-Systems, das Bild-, Ton- oder Videoinhalte erzeugt oder manipuliert, die ein Deepfake sind, müssen offenlegen, dass die Inhalte künstlich erzeugt oder manipuliert wurden. Diese Pflicht gilt nicht, wenn die Verwendung zur Aufdeckung, Verhütung, Ermittlung oder Verfolgung von Straftaten gesetzlich zugelassen ist. Ist der Inhalt Teil eines offensichtlich künstlerischen, kreativen, satirischen, fiktionalen oder analogen Werks oder Programms, so beschränken sich die in diesem Absatz festgelegten Transparenzpflichten darauf, das Vorhandensein solcher erzeugten oder manipulierten Inhalte in geeigneter Weise offenzulegen, die die Darstellung oder den Genuss des Werks nicht beeinträchtigt.\nBetreiber eines KI-Systems, das Text erzeugt oder manipuliert, der veröffentlicht wird, um die Öffentlichkeit über Angelegenheiten von öffentlichem Interesse zu informieren, müssen offenlegen, dass der Text künstlich erzeugt oder manipuliert wurde. Diese Pflicht gilt nicht, wenn die Verwendung zur Aufdeckung, Verhütung, Ermittlung oder Verfolgung von Straftaten gesetzlich zugelassen ist oder wenn die durch KI erzeugten Inhalte einem Verfahren der menschlichen Überprüfung oder redaktionellen Kontrolle unterzogen wurden und wenn eine natürliche oder juristische Person die redaktionelle Verantwortung für die Veröffentlichung der Inhalte trägt.\n\n(5) Die in den Absätzen 1 bis 4 genannten Informationen werden den betreffenden natürlichen Personen spätestens zum Zeitpunkt der ersten Interaktion oder Aussetzung in klarer und eindeutiger Weise bereitgestellt. Die Informationen müssen den geltenden Barrierefreiheitsanforderungen entsprechen.\n(6) Die Absätze 1 bis 4 lassen die in Kapitel III festgelegten Anforderungen und Pflichten unberührt und berühren nicht andere Transparenzpflichten, die im Unionsrecht oder dem nationalen Recht für Betreiber von KI-Systemen festgelegt sind.\n(7) Die Kommission fördert und erleichtert die Ausarbeitung von Praxisleitfäden auf Unionsebene, um die wirksame Umsetzung der Pflichten in Bezug auf die Feststellung, Markierung und Kennzeichnung künstlich erzeugter oder manipulierter Inhalte zu erleichtern. Die Kommission prüft unter weitestgehender Berücksichtigung der Stellungnahme des KI-Gremiums nach dem Verfahren des Artikels 56 Absatz 6 Unterabsatz 1, ob die Befolgung dieser Praxisleitfäden angemessen ist, um die Einhaltung der in den Absätzen 2 und 4 dieses Artikels festgelegten Pflichten zu gewährleisten. Hält sie den Praxisleitfaden für unangemessen, so kann die Kommission einen Durchführungsrechtsakt gemäß dem in Artikel 98 Absatz 2 genannten Prüfverfahren erlassen, in dem gemeinsame Vorschriften für die Umsetzung dieser Pflichten festgelegt werden."}};
// „Auslöser: welche Frage der Eingabe die Aufgabe auslöst (Feld-ID).“
const AUSF = {"Deine Rolle":"rolle","Server":"betrieb","Anzahl Betroffene":"umfang","KI-Modelle":"llm","Standort der Anbieter":"region","Datenschutzvertrag (AVV)":"avv","Training":"anbieter","Wer sieht die KI":"kontakt"};
// „Themen-Cluster der Checkliste: gleiche Namen wie die Schritte der Eingabe. Der Auslöser einer Aufgabe bestimmt ihr Thema.“
const CL = ["Projekt und Rolle","Daten","Anbieter und Verträge","KI-Einsatz","Jedes Projekt"];
const CLZU = {"Deine Rolle":0,"Server":0,"Anzahl Betroffene":1,"KI-Modelle":2,"Standort der Anbieter":2,"Datenschutzvertrag (AVV)":2,"Training":2,"Wer sieht die KI":3,"Gilt für jedes Projekt":4};
TD.forEach(x => x.c = CLZU[x.a]);
// „Reihenfolge wie die Gesetze: erst DSGVO, dann AI Act, je Gesetz nach Artikelnummer. Aufgaben ohne Gesetzesstelle (Checkliste, Praxis) stehen ganz unten. Gleiche Artikel behalten ihre Reihenfolge.“
const ohne = x => /^(Checkliste|Praxis)$/.test(x.r);
const artNr = x => +((x.r.match(/Art\. (\d+)/) || [0, 0])[1]);
TD.sort((a, b) => ohne(a) - ohne(b) || (a.l == "AI") - (b.l == "AI") || artNr(a) - artNr(b));
const DONE = new Set();
let tab = -1;
// „Der Weg rechts: Titel und die Fragen, die dort kommen. Der letzte Eintrag ist das Ergebnis.“
const WEG = [
  {t:"Projekt und Rolle", f:["Projektname","Projektbeschreibung","Deine Rolle","Server","Sonderfälle"]},
  {t:"Daten", f:["Angaben über Menschen","Betroffene","Speicherorte","Anzahl und Tests"]},
  {t:"Anbieter und Verträge", f:["KI-Modelle","Weitere Dienste","Standort und Training","Datenschutzvertrag"]},
  {t:"KI-Einsatz", f:["Wer sieht die KI","Wer entscheidet","Einsatzbereich","Bewertung von Menschen"]},
  {t:"Dein Prüfplan", f:["Kennzahlen, To-dos, Gesetze"], ergebnis:true}
];

// ---------- ABSCHNITT 2: Hilfsfunktionen ----------
// „Sonderzeichen entschärfen, damit Text im HTML sicher bleibt.“
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// „Einen Chip zeichnen: Name vorn, Beispiel in Klammern wandert in den Hinweis.“
function chip(o, sel, multi){
  const m = o[1].match(/^(.*?)\s*\((.*)\)\s*$/);
  const voll = o[2] == "v";
  const nm = m && !voll ? m[1] : o[1], ex = m && !voll ? m[2] : "";
  return `<span class="c${multi ? " k" : " r"}${sel.includes(o[0]) ? " on" : ""}"${ex ? ` data-ex="${esc(ex)}"` : ""}>${esc(nm)}</span>`;
}
// „Alle Chips einer Frage. Bei Gruppen (z. B. KI-Firmen) je Gruppe ein Etikett mit seinen Chips.“
function chipsHtml(f){
  const sel = ANTWORT[f.id], mehr = f.kind == "Mehrfachauswahl";
  if(!f.g) return `<div class="chips">${f.o.map(o => chip(o, sel, mehr)).join("")}</div>`;
  return `<div class="chips gr">${f.gh ? `<div class="gh">${f.gh}</div>` : ""}${f.g.map(([gt, ids]) => `<div class="grp"><span class="gl">${gt}</span><div class="gc">${ids.map(id => chip(f.o.find(o => o[0] == id), sel, mehr) + (f.notes && f.notes[id] ? `<span class="nt">${f.notes[id]}</span>` : "")).join("")}</div></div>`).join("")}</div>`;
}
// „Eine Frage zeichnen: Titel mit Hilfe, Frage daneben, darunter die Chips.“
function frage(f){
  const i = `<span class="info" data-tip="${esc(f.info)}">i</span>`;
  if(f.t == "text") return `<div class="q"><div class="ql">${f.l}${i}<em>Optional</em></div><input class="inp" value="${esc(ANTWORT[f.id])}" readonly></div>`;
  return `<div class="q"><div class="ql">${f.l}${i}<span class="qq">${f.q}</span><em>${f.kind == "Mehrfachauswahl" ? "Wähle alle, die passen" : "Wähle eine"}</em></div>${chipsHtml(f)}</div>`;
}

// ---------- ABSCHNITT 3: Zustand und Zeichnen ----------
let cur = 0, busy = false, loading = false;
// „Passt die Karte nicht in die Fensterhöhe, wird sie gleichmäßig verkleinert (zoom), bis alles sichtbar ist. Untergrenze 70 %, darunter scrollt die Karte innen.“
function fit(){
  const m = document.querySelector(".main"), c = document.getElementById("cont");
  // „Läuft der Inhalt über den Rand der Karte hinaus? Gemessen wird bei der Zoomstufe z.“
  // „Ergebnisseite und Ladeanzeige: keine Stufen nötig, nur die Liste scrollt innen.“
  if(cur == 4 || loading){ m.style.zoom = 1; m.classList.remove("scroll"); ["ta","tb","tc","tl1","tl2","tz"].forEach(k => document.body.classList.remove(k)); return; }
  const zuHoch = z => { m.style.zoom = z; return c.scrollHeight > c.clientHeight + 1; };
  // „Stufe n: -2 = Chips und Abstände ganz groß, -1 = größer, 0 = luftig, 1 = Frage neben den Titel, 1,5 = wie 1 mit engeren Zeilenabständen, 2 = kleinere Chips, 3 = Untertitel weg.“
  const stufe = n => { document.body.classList.toggle("tl2", n <= -2); document.body.classList.toggle("tl1", n <= -1); document.body.classList.toggle("ta", n >= 1); document.body.classList.toggle("tz", n == 1.5); document.body.classList.toggle("tb", n >= 2); document.body.classList.toggle("tc", n >= 3); };
  m.classList.remove("scroll");
  // „Erst die größte Stufe suchen, die ohne Verkleinern passt. Seiten mit wenig Inhalt bekommen so größere Felder statt großer Lücken.“
  for(const n of [-2, -1, 0, 1, 1.5, 2, 3]){ stufe(n); if(!zuHoch(1)) return; }
  // „Passt auch die engste Stufe nicht, wird verkleinert: größte Zoomstufe zwischen 70 % und 100 % (Halbieren). Darunter scrollt die Karte innen.“
  if(zuHoch(0.7)){ m.classList.add("scroll"); return; }
  let lo = 0.7, hi = 1;
  for(let i = 0; i < 7; i++){ const mid = (lo + hi) / 2; if(zuHoch(mid)) hi = mid; else lo = mid; }
  m.style.zoom = lo;
}
addEventListener("resize", fit);
// „Aktive Seite links: Kopf, dann alle Zeilen, ganz unten die Knöpfe.“
function drawMain(){
  if(cur == 4) return drawResult();
  const p = SEITEN[cur];
  document.querySelector(".main").classList.add("neu");
  document.getElementById("cont").innerHTML =
    `<div class="mh"><span class="step">Schritt ${cur+1} von 4</span><span class="law">${p.law}</span></div>
     <h2>${p.t}</h2><p class="sub">${p.s}</p>
     ${p.rows.map(r => `<div class="row${r.length > 1 ? " pair" : ""}">${r.map(frage).join("")}</div>`).join("")}`;
  const last = cur == SEITEN.length - 1;
  document.getElementById("foot").innerHTML =
    `<button class="btn" id="bBack" ${cur == 0 ? "disabled" : ""}>Zurück</button>
     <span class="hint">Antworten in der Demo fest vorgegeben.</span>
     <button class="btn pri" id="bNext">${last ? "Guide erstellen" : "Weiter"}</button>`;
  fit();
  document.getElementById("bBack").onclick = () => goTo(cur - 1);
  document.getElementById("bNext").onclick = () => last ? laden() : goTo(cur + 1);
}

// „Ergebnisseite zeichnen: Kopf mit Zahlen, Stopp-Streifen, dann die Checkliste. Ein To-do klappt auf, rechts leuchtet die passende Fundstelle.“
function drawResult(){
  const n = TD.length;
  document.getElementById("cont").innerHTML =
    `<div class="mh"><span class="step">Ergebnis</span><span class="law">DSGVO und AI Act</span></div>
     <div class="rh"><div style="flex:1"><h2>Dein Prüfplan</h2><p class="sub">für ${esc(ANTWORT.name)}</p></div>
       <div class="stats"><div class="stat"><b>${n}</b><span>Aufgaben</span></div><div class="stat"><b>29</b><span>Gesetzesstellen</span></div><div class="stat warn"><b>1</b><span>Stopp</span></div></div></div>
     <div class="stop2"><b>Stopp vor dem Start:</b> Keine echten Daten, auch nicht zum Testen, solange AVV und Drittland nicht geklärt sind.</div>
     <div class="rth">Aufgaben nach Thema</div><div class="rt" id="rt">${[["Alle", -1]].concat(CL.map((c, k) => [c, k])).map(([c, k]) => `<button data-k="${k}" class="${k == tab ? "on" : ""}">${c}<b>${k < 0 ? n : TD.filter(x => x.c == k).length}</b></button>`).join("")}</div>
     <div class="flip" id="flip"><div class="fi">
       <div class="face front"><div class="zl"><span>Klick auf eine Aufgabe zeigt Auslöser, Warum, Was, Wer und wo.</span><span class="sp"></span><b id="zn"></b></div><ul class="tdl" id="tdl"></ul></div>
       <div class="face back" id="back"></div>
     </div></div>`;
  liste();
  document.getElementById("rt").onclick = e => { const b = e.target.closest("button"); if(!b) return; tab = +b.dataset.k; document.querySelectorAll("#rt button").forEach(x => x.classList.toggle("on", x == b)); liste(); };
  fussleiste();
}
// „Die Liste zeichnen: nur die Aufgaben des gewählten Themas. Abgehakte bleiben gemerkt.“
function liste(){
  const n = TD.length;
  document.getElementById("tdl").innerHTML = TD.map((x, i) => x.c != tab && tab >= 0 ? "" : `<li><details name="td" data-i="${i}"><summary><input type="checkbox" data-i="${i}"><b>${esc(x.t)}</b><span class="rf ${x.l == "AI" ? "ai" : /^(Checkliste|Praxis)$/.test(x.r) ? "n" : "d"}">${esc(x.r)}</span></summary>
        <div class="tdb"><p><span class="k">Auslöser:</span> ${ausloeser(x)}</p><p><span class="k">Warum:</span> ${esc(x.why)}${x.q && x.q.length ? ` <a class="gz" data-i="${i}">${esc(x.r.replace(/\s*\(.*\)$/, ""))}</a>` : ""}</p><p><span class="k">Was:</span> ${esc(x.was)}</p><p><span class="k">Wer und wo:</span> ${esc(x.wer)}</p></div></details></li>`).join("");
  // „Abhaken zählt mit.“
  document.querySelectorAll(".tdl input").forEach(c => { c.checked = DONE.has(+c.dataset.i); c.onclick = e => e.stopPropagation(); c.onchange = () => { c.checked ? DONE.add(+c.dataset.i) : DONE.delete(+c.dataset.i); document.getElementById("zn").textContent = DONE.size + " von " + n + " erledigt"; }; });
  document.getElementById("zn").textContent = DONE.size + " von " + n + " erledigt";
  // „Klick auf die Fundstelle: Karte umdrehen und den Originaltext zeigen.“
  document.querySelectorAll(".tdl a.gz").forEach(a => a.onclick = e => { e.preventDefault(); gesetz(+a.dataset.i); });
  // „Aufklappen: rechts die Fundstelle der Aufgabe hervorheben.“
  document.querySelectorAll(".tdl details").forEach(d => d.addEventListener("toggle", () => {
    document.querySelectorAll(".laws li").forEach(li => li.classList.toggle("hl", d.open && li.dataset.i == d.dataset.i));
  }));
}
// „Auslöser in Worten der Eingabe: Frage, gewählte Antwort und Schritt, z. B. Server: Ich selbst, Standort EU (Schritt 1).“
function ausloeser(x){
  const id = AUSF[x.a];
  if(!id) return esc(x.a);
  let fr, nr;
  SEITEN.forEach((p, n) => p.rows.flat().forEach(f => { if(f.id == id){ fr = f; nr = n + 1; } }));
  if(!fr) return esc(x.a);
  const w = [].concat(ANTWORT[id] || []).map(k => { const o = fr.o.find(o => o[0] == k); return o ? o[1] : k; }).join(", ");
  return `${esc(fr.l)}: ${esc(w)} <span style="color:var(--faint)">(Schritt ${nr})</span>`;
}
// „Rückseite füllen: je zitiertem Artikel Titel und die genannten Absätze im Originaltext, dann umdrehen.“
function gesetz(i){
  const x = TD[i];
  const teile = x.q.map(([g, a, abs]) => {
    const L = LT[g + "|" + a]; if(!L) return "";
    // „Text in Absätze zerlegen: jeder Absatz beginnt mit (1), (2) …“
    const st = L.c.split(/\n(?=\(\d+\))/);
    const zeig = abs.length ? st.filter(p => abs.includes(+((p.match(/^\((\d+)\)/) || [0, 0])[1]))) : st;
    const kurz = g == "EU AI Act" ? "AI Act" : g;
    return `<h4>${kurz} Art. ${a}<small>${esc(L.t)}${abs.length ? " · Auszug: Abs. " + abs.join(", ") : ""}</small></h4>` +
      // „Jede Zeile ein eigener Block; Unterpunkte wie a), b), c) rücken nach rechts ein.“
      zeig.map(p => `<p>${esc(p).replace(/^\((\d+)\)/, "<b>($1)</b>").split("\n").map(z => `<span class="ln${/^[a-z]{1,3}\)\s/.test(z) ? " lb" : ""}">${z}</span>`).join("")}</p>`).join("");
  }).join("");
  document.getElementById("back").innerHTML =
    `<div class="bk"><span>Gesetzestext zu: <b style="color:#0b3d2b">${esc(x.t)}</b></span><span class="sp"></span><a class="zur">Hier geht's zurück zur Checkliste</a></div>
     <div class="lt">${teile}<p class="fn">Originaltext aus den Gesetzeskarten des Guides (Stand DSGVO 06.10.2026, AI Act 27.07.2026).</p><a class="zur">Hier geht's zurück zur Checkliste</a></div>`;
  document.querySelectorAll("#back .zur").forEach(z => z.onclick = () => document.getElementById("flip").classList.remove("turn"));
  document.getElementById("flip").classList.add("turn");
}
function fussleiste(){
  document.getElementById("foot").innerHTML =
    `<button class="btn" id="bBack">Zurück</button><span class="hint">Beispiel aus dem Testfall Mieter-Chatbot.</span><button class="btn pri" id="bNext">Neu starten</button>`;
  document.getElementById("bBack").onclick = () => goTo(3);
  document.getElementById("bNext").onclick = () => goTo(0);
  fit();
}
// „Ladeanzeige nach Klick auf Guide erstellen: Karte zeigt drei Schritte, danach gleitet das Ergebnis herein.“
function laden(){
  if(busy) return;
  busy = true; loading = true;
  const cont = document.getElementById("cont"), it = document.getElementById("it4");
  it.classList.add("lit"); cont.classList.add("out-l");
  document.getElementById("foot").innerHTML = "";
  setTimeout(() => {
    cont.innerHTML = `<div class="ld" role="status"><div class="spin"></div><h2>Dein Prüfplan wird erstellt</h2><p class="sub">In der Demo dauert das 4 Sekunden, live meist 15 bis 75.</p>
      <ul><li>Antworten prüfen</li><li>Passende Gesetzesartikel holen</li><li>KI schreibt die Zusammenfassungen</li></ul></div>`;
    fit();
    cont.classList.remove("out-l"); cont.classList.add("pre-r"); void cont.offsetWidth; cont.classList.remove("pre-r");
    [900, 2000, 3100].forEach((t, i) => setTimeout(() => { const l = cont.querySelectorAll(".ld li")[i]; if(l) l.classList.add("on"); }, t));
    setTimeout(() => {
      cont.classList.add("out-l");
      setTimeout(() => {
        loading = false; cur = 4; drawMain(); setSide();
        cont.classList.remove("out-l"); cont.classList.add("pre-r"); void cont.offsetWidth; cont.classList.remove("pre-r");
        it.classList.remove("lit"); setTimeout(() => busy = false, 450);
      }, 380);
    }, 4000);
  }, 380);
}
// „Weg rechts einmal aufbauen: je Eintrag eine Karte (wartend) und ein Haken (erledigt), beide zugeklappt oder offen.“
function buildSide(){
  document.getElementById("side").innerHTML = `<h3>Dein Weg</h3>` + WEG.map((s, i) =>
    `<div class="it" id="it${i}">
       <div class="g gw"><div class="in"><div class="w"><div class="wt"><i>${s.ergebnis ? "★" : i+1}</i>${s.t}</div><ul>${s.f.map(x => `<li>${x}</li>`).join("")}</ul></div></div></div>
       ${s.ergebnis ? "" : `<div class="g gd"><div class="in"><div class="dn" data-i="${i}"><i>✓</i>${s.t}</div></div></div>`}
     </div>`).join("") +
    `<div class="g laws off" id="laws"><div class="in">` + [["D","DSGVO"],["AI","EU AI Act"]].map(([k, nm]) =>
      `<div class="w ${k == "D" ? "d" : "ai"}"><div class="wt"><i>§</i>${nm}</div><ul>${TD.map((x, i) => x.l == k ? `<li data-i="${i}">${esc(x.r)}</li>` : "").join("")}</ul></div>`).join("") + `</div></div>`;
  document.querySelectorAll(".dn").forEach(d => d.onclick = () => goTo(+d.dataset.i));
  setSide();
}
// „Zustand je Eintrag: davor = Haken, aktuell = ganz zugeklappt (steht links), danach = Karte.“
function setSide(){
  WEG.forEach((s, i) => {
    const gw = document.querySelector(`#it${i} .gw`), gd = document.querySelector(`#it${i} .gd`);
    gw.classList.toggle("off", i <= cur);
    if(gd) gd.classList.toggle("off", i >= cur);
  });
  document.getElementById("laws").classList.toggle("off", cur != 4);
}

// ---------- ABSCHNITT 4: Der Übergang ----------
// „Zu Seite n wechseln: Karte leuchtet, Inhalt schiebt weg, dann kommt der neue von der Seite, rechts klappt es um.“
function goTo(n){
  if(busy || loading || n == cur || n < 0 || n > 4) return;
  busy = true;
  const vor = n > cur, cont = document.getElementById("cont"), it = document.getElementById("it" + n);
  if(vor) it.classList.add("lit");
  cont.classList.add(vor ? "out-l" : "out-r");
  setTimeout(() => {
    cur = n; drawMain(); setSide();
    const c = document.getElementById("cont");
    c.classList.remove("out-l", "out-r"); c.classList.add(vor ? "pre-r" : "pre-l"); void c.offsetWidth; c.classList.remove("pre-r", "pre-l");
    it.classList.remove("lit");
    setTimeout(() => busy = false, 450);
  }, 380);
}
// „Pfeiltasten wechseln die Seite.“
addEventListener("keydown", e => { if(e.key == "ArrowRight") goTo(cur + 1); if(e.key == "ArrowLeft") goTo(cur - 1); });

// ---------- ABSCHNITT 5: Start ----------
drawMain(); buildSide();
// „Wenn die Schrift DM Sans geladen ist, ändert sich die Höhe leicht, dann noch einmal passen.“
if(document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
// „Mit #2 oder #3 in der Adresse öffnet die Seite direkt auf dieser Seite (zum Prüfen, ohne Animation).“
const hm = location.hash.match(/^#(\d)$/);
if(hm && +hm[1] >= 1 && +hm[1] <= 5){ cur = +hm[1]-1; drawMain(); setSide(); }
</script>
