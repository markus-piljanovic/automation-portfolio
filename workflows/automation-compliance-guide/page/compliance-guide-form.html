// „Beispielantworten (Testfall 09), nur für die Adresse #demo zum Prüfen.“
const DEMOA = {"name": "Mieter-Chatbot", "rolle": "avv", "betrieb": "selbst", "besonder": ["nichts"], "daten": ["kontakt", "vertrag", "komm"], "betroffen": ["endkunden"], "haltung": ["logs", "vektor", "backup"], "umfang": "hoch", "test": "echt", "inhalte": ["nichts"], "llm": ["openai"], "llmx": "", "dienste": ["auto"], "region": "std", "avv": "teil", "anbieter": "std", "kontakt": ["direkt"], "auto": "assist", "bereich": ["keiner"], "bewert": ["nichts"], "text": "Chatbot fuer Mieteranfragen"};
// „Themen der Checkliste: gleiche Namen wie die Schritte der Eingabe, dazu "Jedes Projekt".“
const CL = ["Projekt und Rolle","Daten","Anbieter und Verträge","KI-Einsatz","Jedes Projekt"];
// „Der Weg rechts: Titel und die Fragen, die dort kommen. Der letzte Eintrag ist das Ergebnis.“
const WEG = [
  {t:"Projekt und Rolle", f:["Projektname","Deine Rolle","Server","Sonderfälle"]},
  {t:"Daten", f:["Angaben über Menschen","Betroffene","Speicherorte","Anzahl und Tests"]},
  {t:"Anbieter und Verträge", f:["KI-Modelle","Weitere Dienste","Standort und Training","Datenschutzvertrag"]},
  {t:"KI-Einsatz", f:["Wer sieht die KI","Wer entscheidet","Einsatzbereich","Bewertung von Menschen"]},
  {t:"Dein Prüfplan", f:["Kennzahlen, To-dos, Gesetze"], ergebnis:true}
];
// „Platzhaltertexte der beiden Textfelder.“
const PH = {name:"z. B. Mieter-Chatbot Hausverwaltung X", text:"z. B. Chatbot beantwortet Mieteranfragen"};
// „Antworten, die alle anderen ausschließen (z. B. "Nichts davon" oder "Weiß ich nicht").“
const EXCL = ["nichts","keine","unklar","keinllm","keiner","kein"];

// ---------- ABSCHNITT 2: Zustand ----------
// „A = alle Antworten, SRV = Antwort des Workflows, DONE = abgehakte To-dos, TDS = die To-dos dieses Ergebnisses.“
const A = {}; const DONE = new Set(); let SRV = null, TDS = [], tab = -1;
let cur = 0, busy = false, loading = false, msg = null;
// „Fragen schnell finden: nach ID, mit der Seite, auf der sie stehen.“
const FBY = {}; SEITEN.forEach((p, n) => p.rows.flat().forEach(f => { FBY[f.id] = f; f.page = n; }));

// ---------- ABSCHNITT 3: Hilfsfunktionen ----------
// „Sonderzeichen entschärfen, damit Text im HTML sicher bleibt.“
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// „Name vor der Klammer: aus "ChatGPT (OpenAI)" wird "ChatGPT".“
const short = t => t.split(" (")[0];
// „Beschriftung einer Antwort nachschlagen.“
const lab = (id, k) => { const o = FBY[id].o.find(o => o[0] == k); return o ? o[1] : k; };
// „Gewählte Antworten einer Frage immer als Liste.“
const sel = id => [].concat(A[id] === undefined ? [] : A[id]);
// „KI-Modelle auswerten: außerhalb der EU, EU, eigener Rechner, offen. Die beiden "Sonstige" bekommen sprechende Namen.“
function llmInfo(){
  const third = [], eu = [], v = sel("llm");
  v.forEach(k => {
    if(["openai","anthropic","google","azure"].includes(k)) third.push(short(lab("llm", k)));
    if(k == "andere_usa") third.push("eine sonstige KI aus den USA");
    if(["mistral","aleph"].includes(k)) eu.push(short(lab("llm", k)));
    if(k == "andere_eu") eu.push("eine sonstige KI aus der EU");
  });
  return {third, eu, unklar: v.includes("unklar")};
}
// „Sind Dienste außerhalb des eigenen Servers im Spiel? Wenn nicht, entfallen Standort, Training und Vertrag.“
function extPresent(){
  const L = llmInfo();
  return !!(L.third.length || L.eu.length || L.unklar || sel("dienste").some(k => ["auto","crm","voice","unklar"].includes(k)) || A.betrieb == "cloud");
}
// „Keine Angaben über Menschen: dann entfallen Betroffene, Anzahl und Tests.“
const noPersons = () => sel("daten").length == 1 && sel("daten")[0] == "keine";
// „Ist die Frage gerade ausgeblendet?“
function hid(f){
  if(["region","avv","anbieter"].includes(f.id)) return !extPresent();
  if(["betroffen","umfang","test"].includes(f.id)) return noPersons();
  return false;
}
// „Zeilen einer Seite ohne die ausgeblendeten Fragen.“
const rowsOf = p => p.rows.map(r => r.filter(f => !hid(f))).filter(r => r.length);
// „Platzhalter in den Aufgabentexten mit den gewählten Anbietern füllen.“
function fillTxt(t){
  const L = llmInfo();
  const dn = sel("dienste").filter(k => ["auto","crm","voice"].includes(k)).map(k => short(lab("dienste", k)));
  const ext = [...L.third, ...L.eu, ...dn];
  const all = [...ext, ...(["selbst","selbstx"].includes(A.betrieb) ? ["deinen Server-Anbieter"] : [])];
  return t.replace(/\{llm_us\}/g, L.third.join(", ") || "den Anbietern").replace(/\{dienste_ext\}/g, ext.join(", ") || "den Diensten").replace(/\{dienste\}/g, all.join(", ") || "den Diensten");
}

// ---------- ABSCHNITT 4: Fragen zeichnen ----------
// „Einen Chip zeichnen: Name vorn, Beispiel in Klammern wandert in den Hinweis. Klick wird über data-f und data-v erkannt.“
function chip(o, f){
  const multi = f.kind == "Mehrfachauswahl", on = sel(f.id).includes(o[0]);
  const m = o[1].match(/^(.*?)\s*\((.*)\)\s*$/), voll = o[2] == "v";
  const nm = m && !voll ? m[1] : o[1], ex = m && !voll ? m[2] : "";
  return `<span class="c${multi ? " k" : " r"}${on ? " on" : ""}" data-f="${f.id}" data-v="${o[0]}"${ex ? ` data-ex="${esc(ex)}"` : ""}>${esc(nm)}</span>`;
}
// „Alle Chips einer Frage. Bei Gruppen (z. B. KI-Firmen) je Gruppe ein Etikett mit seinen Chips.“
function chipsHtml(f){
  if(!f.g) return `<div class="chips">${f.o.map(o => chip(o, f)).join("")}</div>`;
  return `<div class="chips gr">${f.gh ? `<div class="gh">${f.gh}</div>` : ""}${f.g.map(([gt, ids]) => `<div class="grp"><span class="gl">${gt}</span><div class="gc">${ids.map(id => chip(f.o.find(o => o[0] == id), f) + (f.notes && f.notes[id] ? `<span class="nt">${f.notes[id]}</span>` : "")).join("")}</div></div>`).join("")}</div>`;
}
// „Eine Frage zeichnen: Titel mit Hilfe, Frage daneben, darunter die Chips oder das Textfeld.“
function frage(f){
  const i = `<span class="info" data-tip="${esc(f.info)}">i</span>`;
  if(f.t == "text") return `<div class="q"><div class="ql">${f.l}${i}<em>Optional</em></div><input class="inp" data-t="${f.id}" maxlength="${f.id == "text" ? 300 : 80}" placeholder="${esc(PH[f.id] || "")}" value="${esc(A[f.id] || "")}"></div>`;
  return `<div class="q"><div class="ql">${f.l}${i}<span class="qq">${f.q}</span><em>${f.kind == "Mehrfachauswahl" ? "Wähle alle, die passen" : "Wähle eine"}</em></div>${chipsHtml(f)}</div>`;
}

// ---------- ABSCHNITT 5: Eingaben aufnehmen ----------
// „Zustand der Sichtbarkeit merken, um zu sehen, ob nach einem Klick Fragen erscheinen oder verschwinden.“
const sig = () => Object.values(FBY).map(f => hid(f) ? 1 : 0).join("");
// „Ein Klick auf einen Chip: einfache Fragen setzen die Antwort, Mehrfachfragen schalten um, "Nichts davon" und "Weiß ich nicht" schließen die anderen aus.“
function pick(f, v){
  const vorher = sig(); const multi = f.kind == "Mehrfachauswahl";
  if(!multi) A[f.id] = v;
  else {
    let l = sel(f.id);
    if(l.includes(v)) l = l.filter(x => x != v);
    else l = EXCL.includes(v) ? [v] : l.filter(x => !EXCL.includes(x)).concat(v);
    A[f.id] = l;
  }
  // „Jede Änderung macht ein altes Ergebnis ungültig.“
  SRV = null; DONE.clear(); msg = null;
  // „Erscheinen oder verschwinden Fragen, die Seite neu zeichnen. Sonst nur die Haken der Chips setzen.“
  if(sig() != vorher) { drawMain(); return; }
  document.querySelectorAll(`#cont .c[data-f="${f.id}"]`).forEach(el => el.classList.toggle("on", sel(f.id).includes(el.dataset.v)));
  const h = document.querySelector("#foot .hint"); if(h){ h.classList.remove("bad"); h.textContent = HINT; }
}
const HINT = "Wähle bei jeder Frage eine Antwort. Nur Orientierung, keine Rechtsberatung.";
document.getElementById("cont").addEventListener("click", e => { const c = e.target.closest(".c[data-f]"); if(c && !loading && cur < 4) pick(FBY[c.dataset.f], c.dataset.v); });
document.getElementById("cont").addEventListener("input", e => { const t = e.target.closest("[data-t]"); if(t) A[t.dataset.t] = t.value; });
// „Welche sichtbaren Pflichtfragen sind noch offen?“
function offen(){
  const out = [];
  SEITEN.forEach(p => rowsOf(p).flat().forEach(f => { if(f.t == "text") return; const v = A[f.id]; if(v === undefined || (Array.isArray(v) && !v.length)) out.push(f); }));
  return out;
}
// „Antworten so senden, wie der Workflow sie erwartet: nur sichtbare Fragen, leere Felder weglassen.“
function payload(){
  const p = {};
  SEITEN.forEach(pg => rowsOf(pg).flat().forEach(f => { const v = A[f.id]; if(v === undefined || v === "" || (Array.isArray(v) && !v.length)) return; p[f.id] = typeof v == "string" ? v.trim() : v; }));
  return p;
}

// ---------- ABSCHNITT 6: Zeichnen ----------
// „Passt die Karte nicht in die Fensterhöhe, wird sie gleichmäßig verkleinert (zoom), bis alles sichtbar ist. Untergrenze 70 %, darunter scrollt die Karte innen.“
function fit(){
  const m = document.querySelector(".main"), c = document.getElementById("cont");
  if(cur == 4 || loading){ m.style.zoom = 1; m.classList.remove("scroll"); ["ta","tb","tc"].forEach(k => document.body.classList.remove(k)); return; }
  const zuHoch = z => { m.style.zoom = z; return c.scrollHeight > c.clientHeight + 1; };
  const stufe = n => { document.body.classList.toggle("ta", n >= 1); document.body.classList.toggle("tb", n >= 2); document.body.classList.toggle("tc", n >= 3); };
  m.classList.remove("scroll");
  for(let n = 0; n <= 3; n++){ stufe(n); if(!zuHoch(1)) return; }
  if(zuHoch(0.7)){ m.classList.add("scroll"); return; }
  let lo = 0.7, hi = 1;
  for(let i = 0; i < 7; i++){ const mid = (lo + hi) / 2; if(zuHoch(mid)) hi = mid; else lo = mid; }
  m.style.zoom = lo;
}
addEventListener("resize", fit);
// „Aktive Seite links: Kopf, dann alle Zeilen, ganz unten die Knöpfe und der Hinweis (rot, wenn etwas fehlt).“
function drawMain(){
  if(cur == 4) return drawResult();
  const p = SEITEN[cur], m = msg && msg.page == cur ? msg.html : "";
  document.querySelector(".main").classList.add("neu");
  document.getElementById("cont").innerHTML =
    `<div class="mh"><span class="step">Schritt ${cur+1} von 4</span><span class="law">${p.law}</span></div>
     <h2>${p.t}</h2><p class="sub">${p.s}</p>
     ${rowsOf(p).map(r => `<div class="row${r.length > 1 ? " pair" : ""}">${r.map(frage).join("")}</div>`).join("")}`;
  const last = cur == SEITEN.length - 1;
  document.getElementById("foot").innerHTML =
    `<button class="btn" id="bBack" ${cur == 0 ? "disabled" : ""}>Zurück</button>
     <span class="hint${m ? " bad" : ""}">${m || HINT}</span>
     <button class="btn pri" id="bNext">${last ? "Guide erstellen" : "Weiter"}</button>`;
  fit();
  document.getElementById("bBack").onclick = () => goTo(cur - 1);
  document.getElementById("bNext").onclick = () => last ? laden() : goTo(cur + 1);
}

// ---------- ABSCHNITT 7: Ergebnis aus der Antwort des Workflows bauen ----------
// „Aus der Serverantwort die To-dos wählen: Gruppe b muss an sein, Bedingung c muss stimmen. Reihenfolge wie die Gesetze, Aufgaben ohne Gesetzesstelle unten.“
function ergebnis(){
  const S = SRV, keep = (x, sw, c) => sw[x.b] && c[x.c || "always"];
  // „Was bliebe, wenn alle "Weiß ich nicht" geklärt wären? Alles andere ist vorsorglich.“
  const sicher = S.unk && S.unk.length && S.without ? new Set(TD.filter(x => keep(x, S.without.sw, S.without.conds)).map(x => x.title)) : null;
  TDS = TD.filter(x => keep(x, S.sw, S.conds)).map(x => {
    let f = x.f;
    // „Die Eskalation hängt an der Frage, die sie ausgelöst hat.“
    if(x.b == "eskal"){
      const w = (S.sw.eskal || [])[0] || "besonder", DEPF = {dritt:(S.sw.dritt || ["llm"])[0], besond:"daten", besch:"daten", hoch:"bereich"};
      f = w[0] == "@" ? (DEPF[w.slice(1)] || "daten") : w;
    }
    return {t:fillTxt(x.title), r:x.ref, l:x.law, f, was:fillTxt(x.k[0]), wer:fillTxt(x.k[1]), why:fillTxt(x.k[2]), q:x.k[3], vs:!!sicher && !sicher.has(x.title), c:f && FBY[f] ? FBY[f].page : 4};
  });
  const ohne = x => /^(Checkliste|Praxis)$/.test(x.r), artNr = x => +((x.r.match(/Art\. (\d+)/) || [0, 0])[1]);
  TDS.sort((a, b) => ohne(a) - ohne(b) || (a.l == "AI") - (b.l == "AI") || artNr(a) - artNr(b));
}
// „Zahl der verschiedenen Gesetzesstellen: alles, was der Workflow abgerufen hat, plus die Grundlagen.“
function zahlStellen(){
  const s = new Set(); const S = SRV;
  ["D","AI"].forEach(k => { ((S.basis || {})[k] || []).forEach(n => s.add(k + n)); Object.values(S.arts || {}).forEach(a => ((a || {})[k] || []).forEach(n => s.add(k + n))); });
  return s.size;
}
// „Ergebnisseite zeichnen: Kopf mit Zahlen, Stopp-Streifen, Hinweise, dann die Checkliste. Ein To-do klappt auf, rechts leuchtet die passende Fundstelle.“
function drawResult(){
  const n = TDS.length, S = SRV;
  const unk = (S.unk || []).filter(id => FBY[id]);
  const hinweise =
    (S.stop ? `<div class="stop2"><b>Stopp vor dem Start:</b> Keine echten Daten, auch nicht zum Testen, solange AVV und Drittland nicht geklärt sind.</div>` : "") +
    (S.kiStatus == "fallback" ? `<div class="klar"><b>Die Zusammenfassungen der KI fehlen:</b> Die KI war nicht erreichbar. Aufgaben und Gesetzestexte sind vollständig.</div>` : "") +
    (unk.length ? `<div class="klar"><b>Offen geblieben:</b> Bei ${unk.map(id => `<a data-go="${FBY[id].page}">${esc(FBY[id].l)}</a>`).join(", ")} hast du „Weiß ich nicht“ gewählt. Der Guide geht auf Nummer sicher und markiert die betroffenen Aufgaben als „vorsorglich“.</div>` : "");
  document.getElementById("cont").innerHTML =
    `<div class="mh"><span class="step">Ergebnis</span><span class="law">DSGVO und AI Act</span></div>
     <div class="rh"><div style="flex:1"><h2>Dein Prüfplan</h2><p class="sub">für ${esc(A.name || "dein Projekt")}</p></div>
       <div class="stats"><div class="stat"><b>${n}</b><span>Aufgaben</span></div><div class="stat"><b>${zahlStellen()}</b><span>Gesetzesstellen</span></div>${S.stop ? `<div class="stat warn"><b>1</b><span>Stopp</span></div>` : ""}</div></div>
     ${hinweise}
     <div class="rth">Aufgaben nach Thema</div><div class="rt" id="rt">${[["Alle", -1]].concat(CL.map((c, k) => [c, k])).map(([c, k]) => `<button data-k="${k}" class="${k == tab ? "on" : ""}">${c}<b>${k < 0 ? n : TDS.filter(x => x.c == k).length}</b></button>`).join("")}</div>
     <div class="flip" id="flip"><div class="fi">
       <div class="face front"><div class="zl"><span>Klick auf eine Aufgabe zeigt Auslöser, Warum, Was, Wer und wo.</span><span class="sp"></span><b id="zn"></b></div><ul class="tdl" id="tdl"></ul></div>
       <div class="face back" id="back"></div>
     </div></div>`;
  liste(); lawsPanel();
  document.getElementById("rt").onclick = e => { const b = e.target.closest("button"); if(!b) return; tab = +b.dataset.k; document.querySelectorAll("#rt button").forEach(x => x.classList.toggle("on", x == b)); liste(); };
  document.querySelectorAll("#cont a[data-go]").forEach(a => a.onclick = () => goTo(+a.dataset.go));
  fussleiste();
}
// „Die Liste zeichnen: nur die Aufgaben des gewählten Themas. Abgehakte bleiben gemerkt.“
function liste(){
  const n = TDS.length;
  document.getElementById("tdl").innerHTML = TDS.map((x, i) => x.c != tab && tab >= 0 ? "" : `<li><details name="td" data-i="${i}"><summary><input type="checkbox" data-i="${i}"><b>${esc(x.t)}</b>${x.vs ? `<span class="vs">vorsorglich</span>` : ""}<span class="rf ${x.l == "AI" ? "ai" : /^(Checkliste|Praxis)$/.test(x.r) ? "n" : "d"}">${esc(x.r)}</span></summary>
        <div class="tdb"><p><span class="k">Auslöser:</span> ${ausloeser(x)}</p><p><span class="k">Warum:</span> ${esc(x.why)}${x.q && x.q.length ? ` <a class="gz" data-i="${i}">${esc(x.r.replace(/\s*\(.*\)$/, ""))}</a>` : ""}</p><p><span class="k">Was:</span> ${esc(x.was)}</p><p><span class="k">Wer und wo:</span> ${esc(x.wer)}</p></div></details></li>`).join("");
  document.querySelectorAll(".tdl input").forEach(c => { c.checked = DONE.has(+c.dataset.i); c.onclick = e => e.stopPropagation(); c.onchange = () => { c.checked ? DONE.add(+c.dataset.i) : DONE.delete(+c.dataset.i); document.getElementById("zn").textContent = DONE.size + " von " + n + " erledigt"; }; });
  document.getElementById("zn").textContent = DONE.size + " von " + n + " erledigt";
  document.querySelectorAll(".tdl a.gz").forEach(a => a.onclick = e => { e.preventDefault(); gesetz(+a.dataset.i); });
  document.querySelectorAll(".tdl details").forEach(d => d.addEventListener("toggle", () => {
    document.querySelectorAll(".laws li").forEach(li => li.classList.toggle("hl", d.open && li.dataset.i == d.dataset.i));
  }));
}
// „Auslöser in Worten der Eingabe: Frage, gewählte Antwort und Schritt, z. B. Server: Ich selbst, Standort EU (Schritt 1).“
function ausloeser(x){
  const fr = FBY[x.f];
  if(!x.f || !fr) return "Gilt für jedes Projekt";
  const w = sel(x.f).map(k => lab(x.f, k)).join(", ");
  return `${esc(fr.l)}${w ? ": " + esc(w) : ""} <span style="color:var(--faint)">(Schritt ${fr.page + 1})</span>`;
}
// „Rückseite füllen: oben die Zusammenfassung der KI (falls da), dann je zitiertem Artikel Titel und die genannten Absätze im Originaltext, dann umdrehen.“
function gesetz(i){
  const x = TDS[i];
  const sm = SRV && SRV.summaries && x.f ? SRV.summaries[x.f + "|" + x.l] : "";
  const teile = x.q.map(([g, a, abs]) => {
    const L = LT[g + "|" + a]; if(!L) return "";
    const st = L.c.split(/\n(?=\(\d+\))/);
    const zeig = abs.length ? st.filter(p => abs.includes(+((p.match(/^\((\d+)\)/) || [0, 0])[1]))) : st;
    const kurz = g == "EU AI Act" ? "AI Act" : g;
    return `<h4>${kurz} Art. ${a}<small>${esc(L.t)}${abs.length ? " · Auszug: Abs. " + abs.join(", ") : ""}</small></h4>` +
      zeig.map(p => `<p>${esc(p).replace(/^\((\d+)\)/, "<b>($1)</b>").split("\n").map(z => `<span class="ln${/^[a-z]{1,3}\)\s/.test(z) ? " lb" : ""}">${z}</span>`).join("")}</p>`).join("");
  }).join("");
  document.getElementById("back").innerHTML =
    `<div class="bk"><span>Gesetzestext zu: <b style="color:#0b3d2b">${esc(x.t)}</b></span><span class="sp"></span><a class="zur">Hier geht's zurück zur Checkliste</a></div>
     <div class="lt">${sm ? `<div class="ks"><b>Zusammenfassung der KI</b>${esc(sm)}</div>` : ""}${teile}<p class="fn">Originaltext aus den Gesetzeskarten des Guides (Stand DSGVO 06.10.2026, AI Act 27.07.2026).</p><a class="zur">Hier geht's zurück zur Checkliste</a></div>`;
  document.querySelectorAll("#back .zur").forEach(z => z.onclick = () => document.getElementById("flip").classList.remove("turn"));
  document.getElementById("flip").classList.add("turn");
}
// „Fußleiste der Ergebnisseite: zurück zu den Fragen oder alles neu beginnen.“
function fussleiste(){
  document.getElementById("foot").innerHTML =
    `<button class="btn" id="bBack">Zurück</button><span class="hint">Ergebnis zu deinen Antworten. Nur Orientierung, keine Rechtsberatung.</span><button class="btn pri" id="bNext">Neu starten</button>`;
  document.getElementById("bBack").onclick = () => goTo(3);
  document.getElementById("bNext").onclick = () => { Object.keys(A).forEach(k => delete A[k]); SRV = null; DONE.clear(); tab = -1; msg = null; goTo(0); };
  fit();
}
// „Rechts die Gesetzesstellen des Ergebnisses, getrennt nach DSGVO und AI Act. Klappt eine Aufgabe auf, leuchtet ihre Stelle.“
function lawsPanel(){
  document.getElementById("laws").innerHTML = `<div class="in">` + [["D","DSGVO"],["AI","EU AI Act"]].map(([k, nm]) =>
    `<div class="w ${k == "D" ? "d" : "ai"}"><div class="wt"><i>§</i>${nm}</div><ul>${TDS.map((x, i) => x.l == k ? `<li data-i="${i}">${esc(x.r)}</li>` : "").join("")}</ul></div>`).join("") + `</div>`;
}

// ---------- ABSCHNITT 8: Absenden ----------
// „Fehler anzeigen: zurück auf die letzte Seite oder zur ersten betroffenen Frage, der Hinweis steht unten in Rot.“
function fehler(html, id){
  loading = false; busy = false;
  const cont = document.getElementById("cont"); cont.classList.remove("out-l");
  cur = id && FBY[id] ? FBY[id].page : 3; msg = {page: cur, html};
  drawMain(); setSide();
}
// „Nach Klick auf Guide erstellen: Pflichtfragen prüfen, Ladeanzeige zeigen, Webhook aufrufen, Ergebnis hereingleiten lassen.“
async function laden(){
  if(busy) return;
  const o = offen();
  if(o.length){ const s = o[0].page; msg = {page: s, html: "Noch offen: " + o.map(f => esc(f.l)).join(", ") + "."}; if(s == cur) drawMain(); else goTo(s); return; }
  busy = true; loading = true;
  const cont = document.getElementById("cont"), it = document.getElementById("it4");
  it.classList.add("lit"); cont.classList.add("out-l");
  document.getElementById("foot").innerHTML = "";
  await new Promise(r => setTimeout(r, 380));
  cont.innerHTML = `<div class="ld" role="status"><div class="spin"></div><h2>Dein Prüfplan wird erstellt</h2><p class="sub">Das dauert meist 15 bis 75 Sekunden (<span id="lt">0</span> s).</p>
    <ul><li>Antworten prüfen</li><li>Passende Gesetzesartikel holen</li><li>KI schreibt die Zusammenfassungen</li></ul></div>`;
  fit();
  cont.classList.remove("out-l"); cont.classList.add("pre-r"); void cont.offsetWidth; cont.classList.remove("pre-r");
  const t0 = Date.now(), zeitgeber = setInterval(() => { const l = document.getElementById("lt"); if(l) l.textContent = Math.round((Date.now() - t0) / 1000); }, 1000);
  [900, 2000, 3100].forEach((t, i) => setTimeout(() => { const l = cont.querySelectorAll(".ld li")[i]; if(l) l.classList.add("on"); }, t));
  const ctl = new AbortController(), abbruch = setTimeout(() => ctl.abort(), 115000);
  try{
    // „Mindestens 3 Sekunden zeigen, damit die Ladeanzeige nicht flackert.“
    const [res] = await Promise.all([fetch(GUIDE_URL, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(payload()), signal:ctl.signal}), new Promise(r => setTimeout(r, 3000))]);
    let body = null; try{ body = await res.json(); }catch(e){ body = null; }
    if(res.status == 429) return fehler("Das Tageslimit für KI-Anfragen ist für heute erreicht. Bitte versuche es morgen noch einmal.");
    if(res.status == 422 || (body && body.ok === false)){
      const ids = [...new Set(((body && body.errors) || []).map(e => String(e).split(":")[0]))].filter(id => FBY[id]);
      return fehler("Bitte prüfe deine Antworten. " + (ids.length ? "Offen oder ungültig: " + ids.map(id => esc(FBY[id].l)).join(", ") + "." : "Der Guide konnte die Anfrage nicht lesen."), ids[0]);
    }
    if(!res.ok || !body || body.ok !== true) return fehler("Der Guide konnte gerade nicht antworten. Bitte versuche es in einer Minute noch einmal.");
    SRV = body; DONE.clear(); tab = -1; ergebnis();
  }catch(e){
    return fehler(e && e.name == "AbortError" ? "Das dauert länger als erwartet. Bitte versuche es noch einmal." : "Keine Verbindung zum Guide. Bitte prüfe deine Internetverbindung und versuche es noch einmal.");
  }finally{ clearInterval(zeitgeber); clearTimeout(abbruch); }
  cont.classList.add("out-l");
  setTimeout(() => {
    loading = false; cur = 4; drawMain(); setSide();
    cont.classList.remove("out-l"); cont.classList.add("pre-r"); void cont.offsetWidth; cont.classList.remove("pre-r");
    it.classList.remove("lit"); setTimeout(() => busy = false, 450);
  }, 380);
}

// ---------- ABSCHNITT 9: Weg rechts ----------
// „Weg rechts einmal aufbauen: je Eintrag eine Karte (wartend) und ein Haken (erledigt).“
function buildSide(){
  document.getElementById("side").innerHTML = `<h3>Dein Weg</h3>` + WEG.map((s, i) =>
    `<div class="it" id="it${i}">
       <div class="g gw"><div class="in"><div class="w"><div class="wt"><i>${s.ergebnis ? "★" : i+1}</i>${s.t}</div><ul>${s.f.map(x => `<li>${x}</li>`).join("")}</ul></div></div></div>
       ${s.ergebnis ? "" : `<div class="g gd"><div class="in"><div class="dn" data-i="${i}"><i>✓</i>${s.t}</div></div></div>`}
     </div>`).join("") + `<div class="g laws off" id="laws"></div>`;
  document.querySelectorAll(".dn").forEach(d => d.onclick = () => goTo(+d.dataset.i));
  setSide();
}
// „Zustand je Eintrag: davor = Haken, aktuell = ganz zugeklappt (steht links), danach = Karte.“
function setSide(){
  WEG.forEach((s, i) => {
    const gw = document.querySelector(`#it${i} .gw`), gd = document.querySelector(`#it${i} .gd`);
    gw.classList.toggle("off", i <= cur);
    if(gd) gd.classList.toggle("off", i >= cur);
  });
  document.getElementById("laws").classList.toggle("off", cur != 4);
}

// ---------- ABSCHNITT 10: Übergang zwischen Seiten ----------
// „Zu Seite n wechseln: Karte leuchtet, Inhalt schiebt weg, dann kommt der neue von der Seite. Das Ergebnis gibt es nur nach dem Absenden.“
function goTo(n){
  if(busy || loading || n == cur || n < 0 || n > 4 || (n == 4 && !SRV)) return;
  busy = true;
  const vor = n > cur, cont = document.getElementById("cont"), it = document.getElementById("it" + n);
  if(vor) it.classList.add("lit");
  cont.classList.add(vor ? "out-l" : "out-r");
  setTimeout(() => {
    cur = n; drawMain(); setSide();
    const c = document.getElementById("cont");
    c.classList.remove("out-l", "out-r"); c.classList.add(vor ? "pre-r" : "pre-l"); void c.offsetWidth; c.classList.remove("pre-r", "pre-l");
    it.classList.remove("lit");
    setTimeout(() => busy = false, 450);
  }, 380);
}
// „Pfeiltasten wechseln die Seite, aber nicht, solange man in einem Textfeld tippt.“
addEventListener("keydown", e => { if(e.target.closest && e.target.closest("input")) return; if(e.key == "ArrowRight") goTo(cur + 1); if(e.key == "ArrowLeft") goTo(cur - 1); });

// ---------- ABSCHNITT 11: Start ----------
drawMain(); buildSide();
// „Wenn die Schrift geladen ist, ändert sich die Höhe leicht, dann noch einmal passen.“
if(document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
// „Mit #1 bis #4 öffnet die Seite direkt auf diesem Schritt. #demo füllt die Beispielantworten ein, #run schickt sie sofort ab (zum Prüfen).“
const hm = location.hash.match(/^#(\d|demo|run)$/);
if(hm){
  if(hm[1] == "demo" || hm[1] == "run"){ Object.assign(A, JSON.parse(JSON.stringify(DEMOA))); cur = 3; drawMain(); setSide(); if(hm[1] == "run") laden(); }
  else if(+hm[1] >= 1 && +hm[1] <= 4){ cur = +hm[1] - 1; drawMain(); setSide(); }
}
</script>
</body>
</html>
