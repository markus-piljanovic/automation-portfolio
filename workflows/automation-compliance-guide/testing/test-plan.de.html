<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Compliance Guide: Testplan</title>
<style>
/* ---------- ABSCHNITT 1: Look (wie die Demo: helle Karte auf dunkelgrünem Punktraster) ---------- */
:root{--bg:#0f2a21;--card:#fff;--line:#e2e6ec;--ink:#1b2330;--mut:#6a7485;--faint:#a3abb8;--acc:#1e9a69;--acc-bg:#e3f5ec;--d:#965a06;--ai:#5a3fb0;--warn:#b25b00;--warn-bg:#fff3e0;--bad:#b3261e;--bad-bg:#fdeeee}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(circle,rgba(255,255,255,.10) 1.2px,transparent 1.4px) 0 0/22px 22px,var(--bg);color:var(--ink);font:14px/1.4 "DM Sans","Segoe UI",system-ui,sans-serif;height:100vh;height:100dvh;overflow:hidden}
html{overflow:hidden}
#stage{position:absolute;top:0;left:50%;width:1220px;transform-origin:top center;visibility:hidden}
.top{width:100%;padding:18px 26px 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{font-size:18px;font-weight:650;color:#eaf7f0}.top small{color:#8fb5a2;font-weight:400;margin-left:6px;font-size:13px}.sp{flex:1}
.pill{font-size:13px;font-weight:600;color:#ffb454;background:rgba(255,170,60,.12);border:1px solid rgba(255,170,60,.55);padding:5px 13px;border-radius:99px;white-space:nowrap}
.card{display:flex;flex-direction:column;width:calc(100% - 40px);margin:14px 20px 20px;background:var(--card);border-radius:18px;padding:20px 26px 16px;box-shadow:0 8px 28px rgba(0,0,0,.25)}

/* ---------- ABSCHNITT 2: Gruppen als Reiter, Fälle als Chips ---------- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{padding:7px 13px;font-size:13px;font-weight:600;color:var(--mut);border:0;background:none;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;font-family:inherit}
.tab:hover{color:var(--ink)}.tab.on{color:var(--acc);border-color:var(--acc)}.tab small{font-weight:400;color:var(--faint);margin-left:4px}
.tab.mx,.tab.mx:hover{color:#e8890c}.tab.mx.on{color:#e8890c;border-color:#e8890c}
.gtext{color:var(--mut);font-size:12.5px;margin:10px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px}
.c{min-width:34px;text-align:center;padding:4px 8px;border-radius:9px;background:var(--acc-bg);color:#14704c;font-weight:650;font-size:13px;border:0;cursor:pointer;font-family:inherit}
.c.on{background:var(--acc);color:#fff}.c.bad{background:var(--bad-bg);color:var(--bad)}.c.bad.on{background:var(--bad);color:#fff}

/* ---------- ABSCHNITT 3: Titel und Weg der Anfrage ---------- */
h2{font-size:22px;letter-spacing:-.01em;margin-top:12px}h2 span{font-weight:400;color:var(--mut)}
.lead{color:var(--mut);margin-top:3px;max-width:1040px}.lead b{color:var(--ink)}
.erw{margin-top:3px;max-width:1040px;color:var(--ink)}.erw b{color:var(--acc)}
.flow{display:flex;align-items:center;margin:14px 0 4px}
.st{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--ink)}
.st i{width:22px;height:22px;border-radius:50%;background:var(--acc);color:#fff;font-style:normal;font-size:12px;display:grid;place-items:center;flex:none}
.st small{display:block;font-weight:400;color:var(--faint);font-size:11px}
.st.fail i{background:var(--bad)}.st.warn i{background:#e08a00}.st.skip{opacity:.45}.st.skip i{background:#c5cbd4}
.ln{flex:1;border-top:2px dotted #cfe9dc;margin:0 8px;min-width:10px}.ln.skip{border-color:#e4e7ec}

/* ---------- ABSCHNITT 4: Drei Kästen ---------- */
.cols{display:grid;grid-template-columns:1.35fr .8fr 1fr;gap:12px;margin-top:12px}
.col{border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.col h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);display:flex;align-items:center;gap:8px;margin-bottom:8px}
.col h3 b{width:20px;height:20px;border-radius:50%;background:#e8890c;color:#fff;font-size:11px;display:grid;place-items:center;letter-spacing:0}
.step{margin-top:8px}.step:first-of-type{margin-top:0}.step>div:first-child{font-size:12px;font-weight:700}
.row{display:grid;grid-template-columns:124px 1fr;gap:6px;font-size:12.5px;padding:1px 0;line-height:1.3}.row span:first-child{color:var(--faint)}.row b{font-weight:500;overflow-wrap:anywhere}
.row.hl{background:var(--warn-bg);border-radius:7px;padding:3px 6px;margin:1px -6px}.row.hl span:first-child{color:var(--warn)}.row.hl b{color:var(--warn);font-weight:700}
.row.bad{background:var(--bad-bg);border-radius:7px;padding:3px 6px;margin:1px -6px}.row.bad span:first-child{color:var(--bad)}.row.bad b{color:var(--bad);font-weight:700}
.art{display:flex;align-items:flex-start;gap:8px;padding:5px 0;border-bottom:1px solid #f0f2f5;font-size:12.5px}
.art:last-of-type{border:0}.art>span:first-child{width:92px;color:var(--mut);flex:none}
.rf{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:6px;border:1px solid;margin:0 3px 3px 0;background:#fff}
.rf.d{border-color:#e6c48c;color:var(--d)}.rf.ai{border-color:#c9bdf0;color:var(--ai)}.rf.n{border-color:#d5d9e0;color:var(--mut)}
.art.hl{background:var(--warn-bg);border-radius:8px;padding:5px 6px;margin:0 -6px}.art.hl>span:first-child{color:var(--warn);font-weight:700}
.note{font-size:11.5px;color:var(--mut);margin-top:8px}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}table.t th{font-size:11px;font-weight:600;color:var(--faint);text-align:left;padding:3px 0}table.t td{padding:4px 0;border-top:1px solid #f0f2f5}
table.t td:last-child{text-align:right;color:var(--acc);font-weight:700}table.t td.x:last-child{color:var(--bad)}
.ok{display:flex;align-items:center;gap:10px;background:var(--acc-bg);border-radius:12px;padding:8px 12px;margin-bottom:6px}
.ok i{width:26px;height:26px;border-radius:50%;background:var(--acc);color:#fff;font-style:normal;display:grid;place-items:center;font-weight:700;flex:none}
.ok b{display:block;font-size:14px}.ok small{color:#3d7a62;font-size:12px}
.ok.err{background:var(--bad-bg)}.ok.err i{background:var(--bad)}.ok.err small{color:#8a3d38}
.stopp{background:var(--bad-bg);border:1px solid #f1c6c6;border-radius:10px;padding:8px 10px;font-size:12px;color:#7d2e2e;margin:8px 0 0;line-height:1.35}.stopp span{color:#a14a4a}
.stopp.kein{background:#f4f7f5;border-color:#dfe8e3;color:#4a5b53}.stopp.kein span{color:#66786f}
.sum{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:12px;line-height:1.4}.sum .sh{display:flex;align-items:center;gap:6px;margin-bottom:3px}.sum .sh b{font-size:12.5px}.sum .sm{color:var(--faint);font-size:11px;margin-top:4px}
.foot{margin-top:auto !important;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:12.5px;color:var(--mut)}
.foot a{color:var(--acc);font-weight:650;text-decoration:none;cursor:pointer}

/* ---------- ABSCHNITT 5: Abdeckungs-Matrix ---------- */
.mx-wrap{display:flex;flex-direction:column;gap:14px;margin-top:12px}
.mx-box{overflow-x:auto}
table.m{border-collapse:separate;border-spacing:1px;font-size:12px;table-layout:auto}
table.m th.vh{height:56px;width:18px;vertical-align:bottom;padding:0}
table.m th.vh span{display:block;writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;font-weight:500;color:var(--mut);white-space:nowrap;cursor:default;margin:0 auto}
table.m th.g{font-size:11px;font-weight:700;text-align:left;padding:0 0 3px}table.m th.g.d{color:var(--d);border-bottom:2px solid #e6c48c}table.m th.g.ai{color:var(--ai);border-bottom:2px solid #c9bdf0}
table.m td.rl{padding:0 12px 0 0;white-space:nowrap}table.m td.rl b{display:block;font-size:12.5px;white-space:nowrap}table.m td.rl small{display:block;color:var(--faint);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.m td.cell{width:18px;height:27px;border-radius:4px;background:#f3f5f7;cursor:default}
table.m td.cell.d{background:#e9b867}table.m td.cell.ai{background:#9c88e0}table.m tr.last td.cell{height:20px;background:none;text-align:center;color:var(--acc);font-weight:700;font-size:11px}
table.m td.cell.hv,table.m th.vh.hv span{outline:2px solid var(--ink);color:var(--ink)}
.mx-side{border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-height:118px}
.mx-side h4{font-size:15px;margin-bottom:4px}.mx-side p{font-size:12.5px;color:var(--mut)}.mx-side .tx{margin-top:8px;font-size:12px;line-height:1.45}
</style>
</head>

hen sowie gegebenenfalls seines Vertreters; b) gegebenenfalls die Kontaktdaten des …"},"D14":{"titel":"Informationspflicht, wenn die personenbezogenen Daten nicht bei der betroffenen Person erhoben wurden","text":"(1) Werden personenbezogene Daten nicht bei der betroffenen Person erhoben, so teilt der Verantwortliche der betroffenen Person Folgendes mit: a) den Namen und die Kontaktdaten des Verantwortlichen sowie gegebenenfalls seines Vertreters; b) zusätzlich die Kontaktdaten des Datenschutzbeauftragten; c) die Zwecke, für die die …"},"D15":{"titel":"Auskunftsrecht der betroffenen Person","text":"(1) Die betroffene Person hat das Recht, von dem Verantwortlichen eine Bestätigung darüber zu verlangen, ob sie betreffende personenbezogene Daten verarbeitet werden; ist dies der Fall, so hat sie ein Recht auf Auskunft über diese personenbezogenen Daten und auf folgende Informationen: a) die Verarbeitungszwecke; b) die …"},"D16":{"titel":"Recht auf Berichtigung","text":"Die betroffene Person hat das Recht, von dem Verantwortlichen unverzüglich die Berichtigung sie betreffender unrichtiger personenbezogener Daten zu verlangen. Unter Berücksichtigung der Zwecke der Verarbeitung hat die betroffene Person das Recht, die Vervollständigung unvollständiger personenbezogener Daten — auch mittels einer …"},"D17":{"titel":"Recht auf Löschung („Recht auf Vergessenwerden“)","text":"(1) Die betroffene Person hat das Recht, von dem Verantwortlichen zu verlangen, dass sie betreffende personenbezogene Daten unverzüglich gelöscht werden, und der Verantwortliche ist verpflichtet, personenbezogene Daten unverzüglich zu löschen, sofern einer der folgenden Gründe zutrifft: a) Die personenbezogenen Daten sind für …"},"D18":{"titel":"Recht auf Einschränkung der Verarbeitung","text":"(1) Die betroffene Person hat das Recht, von dem Verantwortlichen die Einschränkung der Verarbeitung zu verlangen, wenn eine der folgenden Voraussetzungen gegeben ist: a) die Richtigkeit der personenbezogenen Daten von der betroffenen Person bestritten wird, und zwar für eine Dauer, die es dem Verantwortlichen ermöglicht, die …"},"D19":{"titel":"Mitteilungspflicht im Zusammenhang mit der Berichtigung oder Löschung personenbezogener Daten oder der Einschränkung der Verarbeitung","text":"Der Verantwortliche teilt allen Empfängern, denen personenbezogenen Daten offengelegt wurden, jede Berichtigung oder Löschung der personenbezogenen Daten oder eine Einschränkung der Verarbeitung nach Artikel 16, Artikel 17 Absatz 1 und Artikel 18 mit, es sei denn, dies erweist sich als unmöglich oder ist mit einem …"},"D20":{"titel":"Recht auf Datenübertragbarkeit","text":"(1) Die betroffene Person hat das Recht, die sie betreffenden personenbezogenen Daten, die sie einem Verantwortlichen bereitgestellt hat, in einem strukturierten, gängigen und maschinenlesbaren Format zu erhalten, und sie hat das Recht, diese Daten einem anderen Verantwortlichen ohne Behinderung durch den Verantwortlichen, dem …"},"D21":{"titel":"Widerspruchsrecht","text":"(1) Die betroffene Person hat das Recht, aus Gründen, die sich aus ihrer besonderen Situation ergeben, jederzeit gegen die Verarbeitung sie betreffender personenbezogener Daten, die aufgrund von Artikel 6 Absatz 1 Buchstaben e oder f erfolgt, Widerspruch einzulegen; dies gilt auch für ein auf diese Bestimmungen gestütztes …"},"D22":{"titel":"Automatisierte Entscheidungen im Einzelfall einschließlich Profiling","text":"(1) Die betroffene Person hat das Recht, nicht einer ausschließlich auf einer automatisierten Verarbeitung — einschließlich Profiling — beruhenden Entscheidung unterworfen zu werden, die ihr gegenüber rechtliche Wirkung entfaltet oder sie in ähnlicher Weise erheblich beeinträchtigt. (2) Absatz 1 gilt nicht, wenn die …"},"D23":{"titel":"Beschränkungen","text":"(1) Durch Rechtsvorschriften der Union oder der Mitgliedstaaten, denen der Verantwortliche oder der Auftragsverarbeiter unterliegt, können die Pflichten und Rechte gemäß den Artikeln 12 bis 22 und Artikel 34 sowie Artikel 5, insofern dessen Bestimmungen den in den Artikeln 12 bis 22 vorgesehenen Rechten und Pflichten …"},"D24":{"titel":"Verantwortung des für die Verarbeitung Verantwortlichen","text":"(1) Der Verantwortliche setzt unter Berücksichtigung der Art, des Umfangs, der Umstände und der Zwecke der Verarbeitung sowie der unterschiedlichen Eintrittswahrscheinlichkeit und Schwere der Risiken für die Rechte und Freiheiten natürlicher Personen geeignete technische und organisatorische Maßnahmen um, um sicherzustellen und …"},"D25":{"titel":"Datenschutz durch Technikgestaltung und durch datenschutzfreundliche Voreinstellungen","text":"(1) Unter Berücksichtigung des Stands der Technik, der Implementierungskosten und der Art, des Umfangs, der Umstände und der Zwecke der Verarbeitung sowie der unterschiedlichen Eintrittswahrscheinlichkeit und Schwere der mit der Verarbeitung verbundenen Risiken für die Rechte und Freiheiten natürlicher Personen trifft der …"},"D26":{"titel":"Gemeinsam für die Verarbeitung Verantwortliche","text":"(1) Legen zwei oder mehr Verantwortliche gemeinsam die Zwecke der und die Mittel zur Verarbeitung fest, so sind sie gemeinsam Verantwortliche. Sie legen in einer Vereinbarung in transparenter Form fest, wer von ihnen welche Verpflichtung gemäß dieser Verordnung erfüllt, insbesondere was die Wahrnehmung der Rechte der …"},"D27":{"titel":"Vertreter von nicht in der Union niedergelassenen Verantwortlichen oder Auftragsverarbeitern","text":"(1) In den Fällen gemäß Artikel 3 Absatz 2 benennt der Verantwortliche oder der Auftragsverarbeiter schriftlich einen Vertreter in der Union. (2) Die Pflicht gemäß Absatz 1 des vorliegenden Artikels gilt nicht für a) eine Verarbeitung, die gelegentlich erfolgt, nicht die umfangreiche Verarbeitung besonderer Datenkategorien im …"},"D28":{"titel":"Auftragsverarbeiter","text":"(1) Erfolgt eine Verarbeitung im Auftrag eines Verantwortlichen, so arbeitet dieser nur mit Auftragsverarbeitern, die hinreichend Garantien dafür bieten, dass geeignete technische und organisatorische Maßnahmen so durchgeführt werden, dass die Verarbeitung im Einklang mit den Anforderungen dieser Verordnung erfolgt und den …"},"D29":{"titel":"Verarbeitung unter der Aufsicht des Verantwortlichen oder des Auftragsverarbeiters","text":"Der Auftragsverarbeiter und jede dem Verantwortlichen oder dem Auftragsverarbeiter unterstellte Person, die Zugang zu personenbezogenen Daten hat, dürfen diese Daten ausschließlich auf Weisung des Verantwortlichen verarbeiten, es sei denn, dass sie nach dem Unionsrecht oder dem Recht der Mitgliedstaaten zur Verarbeitung …"},"D30":{"titel":"Verzeichnis von Verarbeitungstätigkeiten","text":"(1) Jeder Verantwortliche und gegebenenfalls sein Vertreter führen ein Verzeichnis aller Verarbeitungstätigkeiten, die ihrer Zuständigkeit unterliegen. Dieses Verzeichnis enthält sämtliche folgenden Angaben: a) den Namen und die Kontaktdaten des Verantwortlichen und gegebenenfalls des gemeinsam mit ihm Verantwortlichen, des …"},"D31":{"titel":"Zusammenarbeit mit der Aufsichtsbehörde","text":"Der Verantwortliche und der Auftragsverarbeiter und gegebenenfalls deren Vertreter arbeiten auf Anfrage mit der Aufsichtsbehörde bei der Erfüllung ihrer Aufgaben zusammen."},"D32":{"titel":"Sicherheit der Verarbeitung","text":"(1) Unter Berücksichtigung des Stands der Technik, der Implementierungskosten und der Art, des Umfangs, der Umstände und der Zwecke der Verarbeitung sowie der unterschiedlichen Eintrittswahrscheinlichkeit und Schwere des Risikos für die Rechte und Freiheiten natürlicher Personen treffen der Verantwortliche und der …"},"D33":{"titel":"Meldung von Verletzungen des Schutzes personenbezogener Daten an die Aufsichtsbehörde","text":"(1) Im Falle einer Verletzung des Schutzes personenbezogener Daten meldet der Verantwortliche unverzüglich und möglichst binnen 72 Stunden, nachdem ihm die Verletzung bekannt wurde, diese der gemäß Artikel 51 zuständigen Aufsichtsbehörde, es sei denn, dass die Verletzung des Schutzes personenbezogener Daten voraussichtlich …"},"D34":{"titel":"Benachrichtigung der von einer Verletzung des Schutzes personenbezogener Daten betroffenen Person","text":"(1) Hat die Verletzung des Schutzes personenbezogener Daten voraussichtlich ein hohes Risiko für die persönlichen Rechte und Freiheiten natürlicher Personen zur Folge, so benachrichtigt der Verantwortliche die betroffene Person unverzüglich von der Verletzung. (2) Die in Absatz 1 genannte Benachrichtigung der betroffenen Person …"},"D35":{"titel":"Datenschutz-Folgenabschätzung","text":"(1) Hat eine Form der Verarbeitung, insbesondere bei Verwendung neuer Technologien, aufgrund der Art, des Umfangs, der Umstände und der Zwecke der Verarbeitung voraussichtlich ein hohes Risiko für die Rechte und Freiheiten natürlicher Personen zur Folge, so führt der Verantwortliche vorab eine Abschätzung der Folgen der …"},"D36":{"titel":"Vorherige Konsultation","text":"(1) Der Verantwortliche konsultiert vor der Verarbeitung die Aufsichtsbehörde, wenn aus einer Datenschutz-Folgenabschätzung gemäß Artikel 35 hervorgeht, dass die Verarbeitung ein hohes Risiko zur Folge hätte, sofern der Verantwortliche keine Maßnahmen zur Eindämmung des Risikos trifft. (2) Falls die Aufsichtsbehörde der …"},"D37":{"titel":"Benennung eines Datenschutzbeauftragten","text":"(1) Der Verantwortliche und der Auftragsverarbeiter benennen auf jeden Fall einen Datenschutzbeauftragten, wenn a) die Verarbeitung von einer Behörde oder öffentlichen Stelle durchgeführt wird, mit Ausnahme von Gerichten, die im Rahmen ihrer justiziellen Tätigkeit handeln, b) die Kerntätigkeit des Verantwortlichen oder des …"},"D38":{"titel":"Stellung des Datenschutzbeauftragten","text":"(1) Der Verantwortliche und der Auftragsverarbeiter stellen sicher, dass der Datenschutzbeauftragte ordnungsgemäß und frühzeitig in alle mit dem Schutz personenbezogener Daten zusammenhängenden Fragen eingebunden wird. (2) Der Verantwortliche und der Auftragsverarbeiter unterstützen den Datenschutzbeauftragten bei der Erfüllung …"},"D39":{"titel":"Aufgaben des Datenschutzbeauftragten","text":"(1) Dem Datenschutzbeauftragten obliegen zumindest folgende Aufgaben: a) Unterrichtung und Beratung des Verantwortlichen oder des Auftragsverarbeiters und der Beschäftigten, die Verarbeitungen durchführen, hinsichtlich ihrer Pflichten nach dieser Verordnung sowie nach sonstigen Datenschutzvorschriften der Union bzw. der …"},"D40":{"titel":"Verhaltensregeln","text":"(1) Die Mitgliedstaaten, die Aufsichtsbehörden, der Ausschuss und die Kommission fördern die Ausarbeitung von Verhaltensregeln, die nach Maßgabe der Besonderheiten der einzelnen Verarbeitungsbereiche und der besonderen Bedürfnisse von Kleinstunternehmen sowie kleinen und mittleren Unternehmen zur ordnungsgemäßen Anwendung …"},"D41":{"titel":"Überwachung der genehmigten Verhaltensregeln","text":"(1) Unbeschadet der Aufgaben und Befugnisse der zuständigen Aufsichtsbehörde gemäß den Artikeln 57 und 58 kann die Überwachung der Einhaltung von Verhaltensregeln gemäß Artikel 40 von einer Stelle durchgeführt werden, die über das geeignete Fachwissen hinsichtlich des Gegenstands der Verhaltensregeln verfügt und die von der …"},"D42":{"titel":"Zertifizierung","text":"(1) Die Mitgliedstaaten, die Aufsichtsbehörden, der Ausschuss und die Kommission fördern insbesondere auf Unionsebene die Einführung von datenschutzspezifischen Zertifizierungsverfahren sowie von Datenschutzsiegeln und -prüfzeichen, die dazu dienen, nachzuweisen, dass diese Verordnung bei Verarbeitungsvorgängen von …"},"D43":{"titel":"Zertifizierungsstellen","text":"(1) Unbeschadet der Aufgaben und Befugnisse der zuständigen Aufsichtsbehörde gemäß den Artikeln 57 und 58 erteilen oder verlängern Zertifizierungsstellen, die über das geeignete Fachwissen hinsichtlich des Datenschutzes verfügen, nach Unterrichtung der Aufsichtsbehörde — damit diese erforderlichenfalls von ihren Befugnissen …"},"D44":{"titel":"Allgemeine Grundsätze der Datenübermittlung","text":"Jedwede Übermittlung personenbezogener Daten, die bereits verarbeitet werden oder nach ihrer Übermittlung an ein Drittland oder eine internationale Organisation verarbeitet werden sollen, ist nur zulässig, wenn der Verantwortliche und der Auftragsverarbeiter die in diesem Kapitel niedergelegten Bedingungen einhalten und auch …"},"D45":{"titel":"Datenübermittlung auf der Grundlage eines Angemessenheitsbeschlusses","text":"(1) Eine Übermittlung personenbezogener Daten an ein Drittland oder eine internationale Organisation darf vorgenommen werden, wenn die Kommission beschlossen hat, dass das betreffende Drittland, ein Gebiet oder ein oder mehrere spezifische Sektoren in diesem Drittland oder die betreffende internationale Organisation ein …"},"D46":{"titel":"Datenübermittlung vorbehaltlich geeigneter Garantien","text":"(1) Falls kein Beschluss nach Artikel 45 Absatz 3 vorliegt, darf ein Verantwortlicher oder ein Auftragsverarbeiter personenbezogene Daten an ein Drittland oder eine internationale Organisation nur übermitteln, sofern der Verantwortliche oder der Auftragsverarbeiter geeignete Garantien vorgesehen hat und sofern den betroffenen …"},"D47":{"titel":"Verbindliche interne Datenschutzvorschriften","text":"(1) Die zuständige Aufsichtsbehörde genehmigt gemäß dem Kohärenzverfahren nach Artikel 63 verbindliche interne Datenschutzvorschriften, sofern diese a) rechtlich bindend sind, für alle betreffenden Mitglieder der Unternehmensgruppe oder einer Gruppe von Unternehmen, die eine gemeinsame Wirtschaftstätigkeit ausüben, gelten und …"},"D48":{"titel":"Nach dem Unionsrecht nicht zulässige Übermittlung oder Offenlegung","text":"Jegliches Urteil eines Gerichts eines Drittlands und jegliche Entscheidung einer Verwaltungsbehörde eines Drittlands, mit denen von einem Verantwortlichen oder einem Auftragsverarbeiter die Übermittlung oder Offenlegung personenbezogener Daten verlangt wird, dürfen unbeschadet anderer Gründe für die Übermittlung gemäß diesem …"},"D49":{"titel":"Ausnahmen für bestimmte Fälle","text":"(1) Falls weder ein Angemessenheitsbeschluss nach Artikel 45 Absatz 3 vorliegt noch geeignete Garantien nach Artikel 46, einschließlich verbindlicher interner Datenschutzvorschriften, bestehen, ist eine Übermittlung oder eine Reihe von Übermittlungen personenbezogener Daten an ein Drittland oder an eine internationale …"},"D50":{"titel":"Internationale Zusammenarbeit zum Schutz personenbezogener Daten","text":"In Bezug auf Drittländer und internationale Organisationen treffen die Kommission und die Aufsichtsbehörden geeignete Maßnahmen zur a) Entwicklung von Mechanismen der internationalen Zusammenarbeit, durch die die wirksame Durchsetzung von Rechtsvorschriften zum Schutz personenbezogener Daten erleichtert wird, b) gegenseitigen …"},"D51":{"titel":"Aufsichtsbehörde","text":"(1) Jeder Mitgliedstaat sieht vor, dass eine oder mehrere unabhängige Behörden für die Überwachung der Anwendung dieser Verordnung zuständig sind, damit die Grundrechte und Grundfreiheiten natürlicher Personen bei der Verarbeitung geschützt werden und der freie Verkehr personenbezogener Daten in der Union erleichtert wird (im …"},"D52":{"titel":"Unabhängigkeit","text":"(1) Jede Aufsichtsbehörde handelt bei der Erfüllung ihrer Aufgaben und bei der Ausübung ihrer Befugnisse gemäß dieser Verordnung völlig unabhängig. (2) Das Mitglied oder die Mitglieder jeder Aufsichtsbehörde unterliegen bei der Erfüllung ihrer Aufgaben und der Ausübung ihrer Befugnisse gemäß dieser Verordnung weder direkter …"},"D53":{"titel":"Allgemeine Bedingungen für die Mitglieder der Aufsichtsbehörde","text":"(1) Die Mitgliedstaaten sehen vor, dass jedes Mitglied ihrer Aufsichtsbehörden im Wege eines transparenten Verfahrens ernannt wird, und zwar — vom Parlament, — von der Regierung, — vom Staatsoberhaupt oder — von einer unabhängigen Stelle, die nach dem Recht des Mitgliedstaats mit der Ernennung betraut wird. (2) Jedes Mitglied …"},"D54":{"titel":"Errichtung der Aufsichtsbehörde","text":"(1) Jeder Mitgliedstaat sieht durch Rechtsvorschriften Folgendes vor: a) die Errichtung jeder Aufsichtsbehörde; b) die erforderlichen Qualifikationen und sonstigen Voraussetzungen für die Ernennung zum Mitglied jeder Aufsichtsbehörde; c) die Vorschriften und Verfahren für die Ernennung des Mitglieds oder der Mitglieder jeder …"},"D55":{"titel":"Zuständigkeit","text":"(1) Jede Aufsichtsbehörde ist für die Erfüllung der Aufgaben und die Ausübung der Befugnisse, die ihr mit dieser Verordnung übertragen wurden, im Hoheitsgebiet ihres eigenen Mitgliedstaats zuständig. (2) Erfolgt die Verarbeitung durch Behörden oder private Stellen auf der Grundlage von Artikel 6 Absatz 1 Buchstabe c oder e, so …"},"D56":{"titel":"Zuständigkeit der federführenden Aufsichtsbehörde","text":"(1) Unbeschadet des Artikels 55 ist die Aufsichtsbehörde der Hauptniederlassung oder der einzigen Niederlassung des Verantwortlichen oder des Auftragsverarbeiters gemäß dem Verfahren nach Artikel 60 die zuständige federführende Aufsichtsbehörde für die von diesem Verantwortlichen oder diesem Auftragsverarbeiter durchgeführte …"},"D57":{"titel":"Aufgaben","text":"(1) Unbeschadet anderer in dieser Verordnung dargelegter Aufgaben muss jede Aufsichtsbehörde in ihrem Hoheitsgebiet a) die Anwendung dieser Verordnung überwachen und durchsetzen; b) die Öffentlichkeit für die Risiken, Vorschriften, Garantien und Rechte im Zusammenhang mit der Verarbeitung sensibilisieren und sie darüber …"},"D58":{"titel":"Befugnisse","text":"(1) Jede Aufsichtsbehörde verfügt über sämtliche folgenden Untersuchungsbefugnisse, die es ihr gestatten, a) den Verantwortlichen, den Auftragsverarbeiter und gegebenenfalls den Vertreter des Verantwortlichen oder des Auftragsverarbeiters anzuweisen, alle Informationen bereitzustellen, die für die Erfüllung ihrer Aufgaben …"},"D59":{"titel":"Tätigkeitsbericht","text":"Jede Aufsichtsbehörde erstellt einen Jahresbericht über ihre Tätigkeit, der eine Liste der Arten der gemeldeten Verstöße und der Arten der getroffenen Maßnahmen nach Artikel 58 Absatz 2 enthalten kann. Diese Berichte werden dem nationalen Parlament, der Regierung und anderen nach dem Recht der Mitgliedstaaten bestimmten …"},"D60":{"titel":"Zusammenarbeit zwischen der federführenden Aufsichtsbehörde und den anderen betroffenen Aufsichtsbehörden","text":"(1) Die federführende Aufsichtsbehörde arbeitet mit den anderen betroffenen Aufsichtsbehörden im Einklang mit diesem Artikel zusammen und bemüht sich dabei, einen Konsens zu erzielen. Die federführende Aufsichtsbehörde und die betroffenen Aufsichtsbehörden tauschen untereinander alle zweckdienlichen Informationen aus. (2) Die …"},"D61":{"titel":"Gegenseitige Amtshilfe","text":"(1) Die Aufsichtsbehörden übermitteln einander maßgebliche Informationen und gewähren einander Amtshilfe, um diese Verordnung einheitlich durchzuführen und anzuwenden, und treffen Vorkehrungen für eine wirksame Zusammenarbeit. Die Amtshilfe bezieht sich insbesondere auf Auskunftsersuchen und aufsichtsbezogene Maßnahmen, …"},"D62":{"titel":"Gemeinsame Maßnahmen der Aufsichtsbehörden","text":"(1) Die Aufsichtsbehörden führen gegebenenfalls gemeinsame Maßnahmen einschließlich gemeinsamer Untersuchungen und gemeinsamer Durchsetzungsmaßnahmen durch, an denen Mitglieder oder Bedienstete der Aufsichtsbehörden anderer Mitgliedstaaten teilnehmen. (2) Verfügt der Verantwortliche oder der Auftragsverarbeiter über …"},"D63":{"titel":"Kohärenzverfahren","text":"Um zur einheitlichen Anwendung dieser Verordnung in der gesamten Union beizutragen, arbeiten die Aufsichtsbehörden im Rahmen des in diesem Abschnitt beschriebenen Kohärenzverfahrens untereinander und gegebenenfalls mit der Kommission zusammen."},"D64":{"titel":"Stellungnahme Ausschusses","text":"(1) Der Ausschuss gibt eine Stellungnahme ab, wenn die zuständige Aufsichtsbehörde beabsichtigt, eine der nachstehenden Maßnahmen zu erlassen. Zu diesem Zweck überm en oder in Ausübung seiner Befugnisse weder …"},"D70":{"titel":"Aufgaben des Ausschusses","text":"(1) Der Ausschuss stellt die einheitliche Anwendung dieser Verordnung sicher. Hierzu nimmt der Ausschuss von sich aus oder gegebenenfalls auf Ersuchen der Kommission insbesondere folgende Tätigkeiten wahr: a) Überwachung und Sicherstellung der ordnungsgemäßen Anwendung dieser Verordnung in den in den Artikeln 64 und 65 …"},"D71":{"titel":"Berichterstattung","text":"(1) Der Ausschuss erstellt einen Jahresbericht über den Schutz natürlicher Personen bei der Verarbeitung in der Union und gegebenenfalls in Drittländern und internationalen Organisationen. Der Bericht wird veröffentlicht und dem Europäischen Parlament, dem Rat und der Kommission übermittelt. (2) Der Jahresbericht enthält eine …"},"D72":{"titel":"Verfahrensweise","text":"(1) Sofern in dieser Verordnung nichts anderes bestimmt ist, fasst der Ausschuss seine Beschlüsse mit einfacher Mehrheit seiner Mitglieder. (2) Der Ausschuss gibt sich mit einer Mehrheit von zwei Dritteln seiner Mitglieder eine Geschäftsordnung und legt seine Arbeitsweise fest."},"D73":{"titel":"Vorsitz","text":"(1) Der Ausschuss wählt aus dem Kreis seiner Mitglieder mit einfacher Mehrheit einen Vorsitzenden und zwei stellvertretende Vorsitzende. (2) Die Amtszeit des Vorsitzenden und seiner beiden Stellvertreter beträgt fünf Jahre; ihre einmalige Wiederwahl ist zulässig."},"D74":{"titel":"Aufgaben des Vorsitzes","text":"(1) Der Vorsitz hat folgende Aufgaben: a) Einberufung der Sitzungen des Ausschusses und Erstellung der Tagesordnungen, b) Übermittlung der Beschlüsse des Ausschusses nach Artikel 65 an die federführende Aufsichtsbehörde und die betroffenen Aufsichtsbehörden, c) Sicherstellung einer rechtzeitigen Ausführung der Aufgaben des …"},"D75":{"titel":"Sekretariat","text":"(1) Der Ausschuss wird von einem Sekretariat unterstützt, das von dem Europäischen Datenschutzbeauftragten bereitgestellt wird. (2) Das Sekretariat führt seine Aufgaben ausschließlich auf Anweisung des Vorsitzes des Ausschusses aus. (3) Das Personal des Europäischen Datenschutzbeauftragten, das an der Wahrnehmung der dem …"},"D76":{"titel":"Vertraulichkeit","text":"(1) Die Beratungen des Ausschusses sind gemäß seiner Geschäftsordnung vertraulich, wenn der Ausschuss dies für erforderlich hält. (2) Der Zugang zu Dokumenten, die Mitgliedern des Ausschusses, Sachverständigen und Vertretern von Dritten vorgelegt werden, wird durch die Verordnung (EG) Nr. 1049/2001 des Europäischen Parlaments …"},"D77":{"titel":"Recht auf Beschwerde bei einer Aufsichtsbehörde","text":"(1) Jede betroffene Person hat unbeschadet eines anderweitigen verwaltungsrechtlichen oder gerichtlichen Rechtsbehelfs das Recht auf Beschwerde bei einer Aufsichtsbehörde, insbesondere in dem Mitgliedstaat ihres Aufenthaltsorts, ihres Arbeitsplatzes oder des Orts des mutmaßlichen Verstoßes, wenn die betroffene Person der …"},"D78":{"titel":"Recht auf wirksamen gerichtlichen Rechtsbehelf gegen eine Aufsichtsbehörde","text":"(1) Jede natürliche oder juristische Person hat unbeschadet eines anderweitigen verwaltungsrechtlichen oder außergerichtlichen Rechtsbehelfs das Recht auf einen wirksamen gerichtlichen Rechtsbehelf gegen einen sie betreffenden rechtsverbindlichen Beschluss einer Aufsichtsbehörde. (2) Jede betroffene Person hat unbeschadet eines …"},"D79":{"titel":"Recht auf wirksamen gerichtlichen Rechtsbehelf gegen Verantwortliche oder Auftragsverarbeiter","text":"(1) Jede betroffene Person hat unbeschadet eines verfügbaren verwaltungsrechtlichen oder außergerichtlichen Rechtsbehelfs einschließlich des Rechts auf Beschwerde bei einer Aufsichtsbehörde gemäß Artikel 77 das Recht auf einen wirksamen gerichtlichen Rechtsbehelf, wenn sie der Ansicht ist, dass die ihr aufgrund dieser …"},"D80":{"titel":"Vertretung von betroffenen Personen","text":"(1) Die betroffene Person hat das Recht, eine Einrichtung, Organisationen oder Vereinigung ohne Gewinnerzielungsabsicht, die ordn ) Die Mitgliedstaaten können die Befugnisse der Aufsichtsbehörden im Sinne des Artikels 58 Absatz 1 Buchstaben e und f gegenüber den Verantwortlichen oder den Auftragsverarbeitern, die nach Unionsrecht oder dem Recht der Mitgliedstaaten oder nach einer von den zuständigen nationalen Stellen erlassenen Verpflichtung dem …"},"D91":{"titel":"Bestehende Datenschutzvorschriften von Kirchen und religiösen Vereinigungen oder Gemeinschaften","text":"(1) Wendet eine Kirche oder eine religiöse Vereinigung oder Gemeinschaft in einem Mitgliedstaat zum Zeitpunkt des Inkrafttretens dieser Verordnung umfassende Regeln zum Schutz natürlicher Personen bei der Verarbeitung an, so dürfen diese Regeln weiter angewandt werden, sofern sie mit dieser Verordnung in Einklang gebracht …"},"D92":{"titel":"Ausübung der Befugnisübertragung","text":"(1) Die Befugnis zum Erlass delegierter Rechtsakte wird der Kommission unter den in diesem Artikel festgelegten Bedingungen übertragen. (2) Die Befugnis zum Erlass delegierter Rechtsakte gemäß Artikel 12 Absatz 8 und Artikel 43 Absatz 8 wird der Kommission auf unbestimmte Zeit ab dem 24. Mai 2016 übertragen. (3) Die …"},"D93":{"titel":"Ausschussverfahren","text":"(1) Die Kommission wird von einem Ausschuss unterstützt. Dieser Ausschuss ist ein Ausschuss im Sinne der Verordnung (EU) Nr. 182/2011. (2) Wird auf diesen Absatz Bezug genommen, so gilt Artikel 5 der Verordnung (EU) Nr. 182/2011. (3) Wird auf diesen Absatz Bezug genommen, so gilt Artikel 8 der Verordnung (EU) Nr. 182/2011 in …"},"D94":{"titel":"Aufhebung der Richtlinie 95/46/EG","text":"(1) Die Richtlinie 95/46/EG wird mit Wirkung vom 25. Mai 2018 aufgehoben. (2) Verweise auf die aufgehobene Richtlinie gelten als Verweise auf die vorliegende Verordnung. Verweise auf die durch Artikel 29 der Richtlinie 95/46/EG eingesetzte Gruppe für den Schutz von Personen bei der Verarbeitung personenbezogener Daten gelten …"},"D95":{"titel":"Verhältnis zur Richtlinie 2002/58/EG","text":"Diese Verordnung er const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = id => document.getElementById(id);
let state = { fall: null, matrix: false };

/* ---------- ABSCHNITT 7: Zeichnen ---------- */
function chipHtml(c) { return '<span class="rf ' + c.law + '">' + esc(c.t) + '</span>'; }
function flowHtml(f) {
  return DATA.stationen.map((s, k) => {
    const z = f.stationen[k]; const sym = z === 'fail' ? '✗' : z === 'warn' ? '!' : z === 'skip' ? '–' : '✓';
    const ln = k < DATA.stationen.length - 1 ? '<span class="ln' + (f.stationen[k + 1] === 'skip' ? ' skip' : '') + '"></span>' : '';
    return '<div class="st ' + (z === 'ok' ? 'done' : z) + '"><i>' + sym + '</i><div>' + esc(s.name) + '<small>' + esc(s.sub) + '</small></div></div>' + ln;
  }).join('');
}
function maskHtml(f) {
  if (!f.maske.length) return '<p class="note">Es wurde nichts gesendet.</p>';
  return f.maske.map(st => '<div class="step"><div>' + esc(st.t) + '</div>' + st.rows.map(r => '<div class="row' + (r.bad ? ' bad' : r.hl ? ' hl' : '') + '"><span>' + esc(r.l) + '</span><b>' + esc(r.a) + '</b></div>').join('') + '</div>').join('');
}
function artsHtml(f) {
  if (!f.artikel) return '<p class="note">' + esc(f.artikelText || '') + '</p>';
  return f.artikel.zeilen.map(z => '<div class="art' + (z.hl ? ' hl' : '') + '"><span>' + esc(z.l) + '</span><div>' + z.chips.map(chipHtml).join('') + '</div></div>').join('') + '<p class="note">' + esc(f.artikel.note) + '</p>';
}
function resultHtml(f) {
  const r = f.ergebnis; let h = '<div class="ok' + (r.ok ? '' : ' err') + '"><i>' + (r.ok ? '✓' : '✗') + '</i><div><b>' + esc(r.titel) + '</b><small>' + esc(r.sub) + '</small></div></div>';
  h += '<table class="t"><tr><th>Geprüft</th><th>Erwartet</th><th>Ergebnis</th><th></th></tr>' + r.tabelle.map(z => '<tr><td>' + esc(z[0]) + '</td><td>' + esc(z[1]) + '</td><td>' + esc(z[2]) + '</td><td class="' + (z[3] ? '' : 'x') + '">' + (z[3] ? '✓' : '✗') + '</td></tr>').join('') + '</table>';
  if (r.stopp) h += '<div class="stopp' + (r.stopp.kein ? ' kein' : '') + '"><b>Stopp-Regel:</b> ' + esc(r.stopp.regel) + '<br><span>' + esc(r.stopp.grund) + '</span></div>';
  if (r.text) h += '<div class="stopp kein"><span>' + esc(r.text) + '</span></div>';
  if (r.beispiel) h += '<div class="sum"><div class="sh"><span class="rf ' + r.beispiel.law + '">' + esc(r.beispiel.lawName) + '</span><b>' + esc(r.beispiel.titel) + '</b></div>' + esc(r.beispiel.text) + '<div class="sm">' + esc(r.beispiel.hinweis) + '</div></div>';
  return h;
}
function caseHtml(f) {
  const g = DATA.gruppen.find(x => x.id === f.gruppe);
  return '<h2>Fall ' + f.nr + ' <span>· ' + esc(f.name) + '</span></h2><p class="lead"><b>Worum es geht:</b> ' + esc(f.lead) + '</p><p class="erw"><b>Das erwarten wir:</b> ' + esc(f.erw || '') + '</p>'
    + '<div class="flow">' + flowHtml(f) + '</div>'
    + '<div class="cols"><div class="col"><h3><b>1</b>Das wurde angeklickt</h3>' + maskHtml(f) + '</div>'
    + '<div class="col"><h3><b>2</b>Das muss der Guide abrufen</h3>' + artsHtml(f) + '</div>'
    + '<div class="col"><h3><b>3</b>Das kam heraus</h3>' + resultHtml(f) + '</div></div>'
    + '<div class="foot"><span>Fall ' + f.nr + ' von ' + DATA.faelle.length + ' · ' + esc(f.fuss) + '</span><a data-mx="1">Abdeckung: Jeder Gesetzesartikel wird mindestens einmal abgerufen →</a></div>';
}
function matrixHtml() {
  const M = DATA.matrix; const nD = M.spalten.filter(s => s.gesetz === 'D').length, nA = M.spalten.length - nD;
  let h = '<h2>Abdeckung <span>· jeder Gesetzesartikel wird gebraucht</span></h2><p class="lead">Jede Zeile ist ein Fall, jede Spalte ein Gesetzesartikel. Fahre mit der Maus über ein Feld, unten erscheint der Artikel.</p><div class="mx-wrap"><div class="mx-box"><table class="m"><tr><th></th><th class="g d" colspan="' + nD + '">DSGVO</th><th class="g ai" colspan="' + nA + '">EU AI Act</th></tr><tr><th></th>'
    + M.spalten.map((s, k) => '<th class="vh" data-c="' + k + '"><span>' + (s.nr === 'III' ? 'Anh. III' : 'Art. ' + s.nr) + '</span></th>').join('') + '</tr>';
  M.zeilen.forEach(z => { h += '<tr><td class="rl" title="' + esc(z.nr + ' ' + z.name + ' · ' + z.desc) + '"><b>' + z.nr + ' ' + esc(z.name) + '</b></td>' + M.spalten.map((s, k) => '<td class="cell' + (z.set.includes(k) ? ' ' + s.gesetz.toLowerCase().replace('d', 'd') : '') + '" data-c="' + k + '"></td>').join('') + '</tr>'; });
  h += '<tr class="last"><td class="rl"><small>Von mindestens einem Fall abgerufen</small></td>' + M.spalten.map((s, k) => '<td class="cell" data-c="' + k + '">' + (M.zeilen.some(z => z.set.includes(k)) ? '✓' : '✗') + '</td>').join('') + '</tr></table></div>'
    + '<div class="mx-side" id="mxs"><h4>Keine Lücke</h4><p>' + M.abgedeckt + ' von ' + M.spalten.length + ' Gesetzesartikeln werden von mindestens einem der ' + M.zeilen.length + ' Fälle mit gültiger Eingabe abgerufen. Leere Felder sind kein Fehler: Der Guide holt je Anfrage nur die Artikel, die zu den Antworten passen.</p><div class="tx"></div></div></div>'
    + '<div class="foot"><span>Die Grundlagen (Art. 2 bis 4 beider Gesetze) gelten für jedes Projekt und stehen deshalb in jeder Zeile.</span><a data-back="1">← Zurück zu den Fällen</a></div>';
  return h;
}
function render() {
  const card = $('card');
  const tabs = '<div class="tabs">' + DATA.gruppen.map(g => '<button class="tab' + (!state.matrix && state.fall && state.fall.gruppe === g.id ? ' on' : '') + '" data-g="' + g.id + '">' + esc(g.name) + '<small>' + g.faelle.length + '</small></button>').join('') + '<button class="tab mx' + (state.matrix ? ' on' : '') + '" data-mx="1">Abdeckungs-Matrix</button></div>';
  if (state.matrix) { card.innerHTML = tabs + matrixHtml(); bindMatrix(); }
  else {
    const g = DATA.gruppen.find(x => x.id === state.fall.gruppe);
    const chips = '<div class="chips">' + g.faelle.map(n => { const ff = DATA.faelle.find(x => x.nr === n); return '<button class="c' + (ff.gruppe === 'fehler' ? ' bad' : '') + (n === state.fall.nr ? ' on' : '') + '" data-n="' + n + '" title="' + esc(ff.name) + '">' + n + '</button>'; }).join('') + '</div>';
    card.innerHTML = tabs + '<p class="gtext">' + esc(g.text) + '</p>' + chips + caseHtml(state.fall);
  }
  if (bereit) fit();
  card.querySelectorAll('[data-g]').forEach(b => b.onclick = () => { const g = DATA.gruppen.find(x => x.id === b.dataset.g); state.matrix = false; state.fall = DATA.faelle.find(x => x.nr === g.faelle[0]); render(); });
  card.querySelectorAll('[data-n]').forEach(b => b.onclick = () => { state.fall = DATA.faelle.find(x => x.nr === b.dataset.n); render(); });
  card.querySelectorAll('[data-mx]').forEach(b => b.onclick = () => { state.matrix = true; render(); });
  card.querySelectorAll('[data-back]').forEach(b => b.onclick = () => { state.matrix = false; render(); });
}
function bindMatrix() {
  const side = $('mxs'), tx = side.querySelector('.tx'), base = side.innerHTML;
  document.querySelectorAll('#card [data-c]').forEach(el => { el.onmouseenter = () => {
    const k = +el.dataset.c, s = DATA.matrix.spalten[k], inf = DATA.info[s.gesetz + s.nr] || {};
    document.querySelectorAll('#card [data-c="' + k + '"]').forEach(e => e.classList.add('hv'));
    side.innerHTML = '<h4>' + (s.gesetz === 'D' ? 'DSGVO' : 'EU AI Act') + ' ' + (s.nr === 'III' ? 'Anhang III' : 'Art. ' + s.nr) + '</h4><p>' + esc(inf.titel || '') + '</p><div class="tx">' + esc(inf.text || '') + '</div>';
  }; el.onmouseleave = () => { document.querySelectorAll('#card .hv').forEach(e => e.classList.remove('hv')); side.innerHTML = base; }; });
}

/* ---------- ABSCHNITT 8: Skalierung und Start ---------- */
const stage = $('stage'), spacer = $('spacer'); let bereit = false;
// „Die ganze Seite wird so skaliert, dass sie in Fenster passt (Breite und Höhe). Zoomen oder eine andere Bildschirmgröße löst eine neue Berechnung aus. Nur bei winzigen Fenstern scrollt die Seite.“
function fit() {
  stage.style.transform = 'none'; const w = stage.offsetWidth, h = stage.offsetHeight;
  let sc = Math.min(innerWidth / w, innerHeight / h, 1.6); const scroll = sc < 0.4; sc = Math.max(sc, 0.4);
  document.documentElement.style.overflowY = document.body.style.overflowY = scroll ? 'auto' : 'hidden';
  stage.style.transform = 'translateX(-50%) scale(' + sc + ')'; spacer.style.height = scroll ? Math.ceil(h * sc) + 'px' : '0';
}
// „Alle Ansichten einmal zeichnen und die höchste Karte merken. So ist die Karte bei jedem Fall gleich groß, und die Skalierung springt nicht.“
function messen() {
  const card = $('card'); const alt = { f: state.fall, m: state.matrix }; let max = 0; card.style.minHeight = '0';
  DATA.faelle.forEach(f => { state.fall = f; state.matrix = false; render(); max = Math.max(max, card.offsetHeight); });
  state.fall = DATA.faelle[0]; state.matrix = true; render(); max = Math.max(max, card.offsetHeight);
  card.style.minHeight = max + 'px'; state.fall = alt.f; state.matrix = alt.m;
}
$('pill').textContent = DATA.bilanz.bestanden + ' von ' + DATA.bilanz.gesamt + ' bestanden · Stand ' + DATA.stand;
const qs = new URLSearchParams(location.search);
state.fall = DATA.faelle.find(f => f.nr === (qs.get('fall') || '1')) || DATA.faelle[0];
state.matrix = qs.get('ansicht') === 'matrix';
function start() { messen(); bereit = true; render(); stage.style.visibility = 'visible'; fit(); }
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(start);
addEventListener('resize', fit);
</script>
